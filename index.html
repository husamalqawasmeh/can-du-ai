<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Can-Du-AI — an AI portfolio by Husam Al-Qawasmeh: community apps, commercial apps, enterprise solutions, agent AI and LLM reviews.">
<!--ARTIFACT-START-->
<title>Can-Du-AI</title>
<!-- The dot from the mark, on its own. SVG first so it stays sharp at any
     size a browser asks for; the .ico is there for the ones that only take
     that, and carries 16, 32 and 48 in the one file. -->
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#E7D6B6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=IBM+Plex+Mono:wght@400;500;700&display=swap">
<style>
  /* One light sand world — no dark variant. Every colour is explicit so the
     page holds its own look whatever theme the browser is set to. */
  :root{
    color-scheme:light;
    --ground:#E7D6B6;
    --ink:#241C10;
    --ink-soft:#655741;
    --line:rgba(36,28,16,.18);
    --card:rgba(255,252,246,.88);
    --card-hover:#FFFDF9;
    --shadow:0 1px 2px rgba(60,44,20,.06), 0 14px 30px -18px rgba(60,44,20,.45);

    /* The three navigation buttons: a beige brown out of the same family as
       the mark, with cream lettering. 4.99:1 at rest and 6.43:1 hovered,
       both over the 4.5 that thirteen-pixel bold type needs. */
    --btn:#7E5F3A;
    --btn-hover:#6B4F2E;
    --btn-ink:#F6ECD8;

    --c-community:#B25A2A;
    --c-commercial:#2F6F76;
    --c-enterprise:#3A4E7A;
    --c-agents:#4E6B35;
    --c-llm:#7A4468;
    --c-multimodal:#2F6B4F;
    --c-lab:#8A6C1F;
    --c-logo:#9C4A1E;
    /* the mark on the logo screen: the same warm brown throughout */
    --mark-ink:#5A3D1C;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Archivo","Helvetica Neue",Arial,sans-serif;
    color:var(--ink);
    background:var(--ground);
    -webkit-font-smoothing:antialiased;
  }

  /* dunes sit behind everything, pinned to the viewport */
  .dunes{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
  }
  .dunes svg{width:100%;height:100%;display:block}

  /* Masthead and bottom bar are pinned; only the middle pane changes. */
  .page{
    position:relative;
    z-index:1;
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
  }

  /* ---------- the top of the page (fixed) ----------
     The mark sits in the top left corner and the middle of the top is left
     empty. The three buttons take their own line below it — the way back on
     the left, the two standing ones on the right. */
  .topline{
    flex:0 0 auto;
    padding:.7rem 1.5rem 0;
    position:relative;
  }
  .topbuttons{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:1rem;
    margin-top:.35rem;
  }
  .top-left,.top-right{min-width:0}
  /* the two standing buttons ride up to the logo's line, on the right */
  .top-right{display:flex;gap:.9rem;position:absolute;top:2.4rem;right:1.5rem}
  /* the resume pages carry no links or comment buttons */
  .on-resume .top-right{display:none}
  @media (max-width:640px){
    .topbuttons{flex-wrap:wrap;justify-content:center;gap:.5rem}
    .top-right{position:static;flex-wrap:wrap;justify-content:center}
  }

  /* ---------- masthead ----------
     It carries the finished mark — the same markup the landing page builds,
     with the story already over. CAN sits above the word and the name below
     it, both out of flow, so the padding here is what reserves their room,
     and it is set in em of the mark so it holds at every size. */
  .masthead{
    flex:0 0 auto;
    display:flex;
    justify-content:flex-start;
    padding:clamp(.4rem,1.2vh,.8rem) 0 0;
  }
  .mast-mark{
    display:inline-block;
    font-size:clamp(1.5rem,1.05rem + 1.9vw,2.45rem);
    padding:.52em 0 .95em;
    text-decoration:none;
    color:inherit;
    border-radius:2px;
  }
  .mast-mark:focus-visible{outline:2px solid var(--mark-ink);outline-offset:4px}
  .sr-only{
    position:absolute;
    width:1px;height:1px;
    padding:0;margin:-1px;
    overflow:hidden;
    clip:rect(0 0 0 0);
    white-space:nowrap;
    border:0;
  }

  /* ---------- the pane that changes ---------- */
  main{
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    padding-bottom:clamp(.75rem,2.5vh,1.5rem);
    width:100%;
    display:flex;
    flex-direction:column;
    /* The groups start at the top and stay where they are. Centred, the whole
       stack slid up the page every time one of them was opened, which is the
       opposite of the rows holding their positions. */
    justify-content:flex-start;
  }
  /* the mark still wants the middle of the page, on the way in and on its
     own screen */
  .is-intro main,
  main.centred{justify-content:center}
  /* and on the way in it must not clip: the mark flies up out of this box into
     the masthead, and a scrolling main would cut it off at its top edge */
  .is-intro main{overflow:visible}
  .pane{
    width:100%;
    max-width:64rem;
    margin:0 auto;
    padding:clamp(1.25rem,3.5vh,2.25rem) 1.5rem;
  }

  /* ---------- the landing ----------
     Three buttons and nothing else on the page: who I am, the resume, and
     the portfolio. The groups live behind the third one now. */
  .hub{
    width:100%;
    max-width:36rem;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    gap:.7rem;
  }
  .hub-item{--accent:var(--ink)}
  .hub-btn{
    position:relative;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:1rem;
    padding:1.1rem 1.45rem;
    font:inherit;
    font-size:1.12rem;
    font-weight:600;
    font-stretch:105%;
    letter-spacing:-.01em;
    color:inherit;
    text-align:left;
    text-decoration:none;
    border:1px solid var(--line);
    border-radius:2px;
    background:var(--card);
    cursor:pointer;
    transition:background .2s ease,border-color .2s ease,
               box-shadow .2s ease,transform .2s ease;
  }
  .hub-btn::before{
    content:"";
    position:absolute;
    left:-1px; top:-1px; bottom:-1px;
    width:2px;
    background:var(--accent);
    transform:scaleY(0);
    transform-origin:top;
    transition:transform .26s cubic-bezier(.2,.7,.3,1);
  }
  .hub-btn:hover,.hub-btn:focus-visible{
    background:var(--card-hover);
    border-color:color-mix(in srgb,var(--accent) 45%,var(--line));
    box-shadow:var(--shadow);
    transform:translateY(-2px);
  }
  .hub-btn:hover::before,
  .hub-item.is-open .hub-btn::before{transform:scaleY(1)}
  .hub-btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .hub-item.is-open .hub-btn{
    background:var(--card-hover);
    border-color:color-mix(in srgb,var(--accent) 45%,var(--line));
    transform:none;
  }
  .hub-mark{
    flex:0 0 auto;
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:.85rem;
    line-height:1;
    color:var(--accent);
  }
  .hub-body{
    padding:.55rem 0 .1rem 1.1rem;
    animation:groupIn .22s ease both;
  }
  /* Label and value on one line, the value a link you can actually use */
  .hub-line{
    display:flex;
    align-items:baseline;
    gap:.8rem;
    padding:.4rem 0;
  }
  .hub-key{
    flex:0 0 4.5rem;
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:.66rem;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .hub-val{
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:.92rem;
    color:var(--accent);
    text-decoration:none;
    border-bottom:1px solid color-mix(in srgb,var(--accent) 35%,transparent);
    overflow-wrap:anywhere;
  }
  .hub-val:hover,.hub-val:focus-visible{border-bottom-color:var(--accent)}

  /* a pick under Picks of the Day: a line that goes to its own screen */
  .pick{
    display:flex;justify-content:space-between;align-items:center;gap:1rem;
    margin:.45rem 0;padding:.8rem 1.1rem;
    font-weight:600;font-stretch:105%;letter-spacing:-.01em;color:inherit;text-decoration:none;
    border:1px solid var(--line);border-radius:2px;background:var(--card);
  }
  .pick:hover,.pick:focus-visible{background:var(--card-hover);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
  .pick:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* the screen of a pick: today's on the left, earlier ones on the right */
  .picks{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:1.5rem;align-items:start}
  @media (max-width:760px){.picks{grid-template-columns:1fr}}
  .picks h2{margin:0 0 .7rem;font-size:1.05rem;font-weight:700;font-stretch:105%}
  .pick-main,.pick-side{padding:1rem 1.2rem;background:var(--card);border:1px solid var(--line);border-top:2px solid var(--accent);border-radius:2px}
  .pick-body{font-size:.95rem;line-height:1.6;color:var(--ink-soft)}
  .pick-body p{margin:.4rem 0}
  .pick-body ul{margin:.4rem 0 0;padding-left:1.1rem}
  .pick-body li{margin:.45rem 0}
  .pick-body li b{color:var(--ink)}
  .pick-video{position:relative;aspect-ratio:16/9;background:#000;border-radius:2px;overflow:hidden}
  .pick-video iframe,.pick-video video{position:absolute;inset:0;width:100%;height:100%;border:0}
  .pick-link{margin:.6rem 0 0;font-size:.9rem}
  .pick-link a{color:var(--accent);overflow-wrap:anywhere}
  .pick-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.6rem}
  .pick-item{
    width:100%;display:flex;flex-direction:column;gap:.4rem;padding:.5rem;text-align:left;
    font:inherit;font-weight:600;color:var(--ink);cursor:pointer;
    background:var(--card-hover);border:1px solid var(--line);border-radius:2px;
  }
  .pick-item:hover,.pick-item:focus-visible,.pick-item.is-on{border-color:var(--accent)}
  .pick-item img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:2px}
  .pick-none{color:var(--ink-soft);font-size:.9rem}
  .pick-today{font:inherit;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}

  /* ---------- the resume ---------- */
  .sheet{
    width:100%;
    max-width:44rem;
    margin:0 auto;
  }
  .sheet h2{
    font-size:clamp(1.5rem,1.2rem + 1.4vw,2.1rem);
    font-weight:700;
    font-stretch:110%;
    letter-spacing:-.02em;
    line-height:1.05;
    margin:0;
  }
  .sheet-rule{width:3.5rem;height:2px;background:var(--accent);margin:.7rem 0 1rem}
  .sheet p{margin:0 0 .9rem;font-size:.95rem;line-height:1.6;color:var(--ink-2,var(--ink-soft))}

  /* The resume is one screen: a header, a row of tabs, and a body that holds
     its own scroll, so the page never has to. Experience is a timeline on the
     left and the role you pick on the right. */
  .sheet.res{
    max-width:none;
    padding:1rem 1.3rem 1.1rem;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:2px;
    box-shadow:var(--shadow);
  }
  .res-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:.3rem 1.5rem}
  .res-top h2{font-size:clamp(1.4rem,1.1rem + 1.2vw,1.9rem)}
  .sheet.res p.res-creds{margin:.25rem 0 0;font-size:.82rem;font-weight:600;color:var(--accent)}
  .res-contact{display:flex;flex-wrap:wrap;gap:.2rem 1.2rem;font-size:.82rem}
  .res-contact a{color:inherit}
  .sheet.res p.res-sum{
    margin:.6rem 0 0;
    font-size:.86rem;
    line-height:1.5;
    display:-webkit-box;
    -webkit-box-orient:vertical;
    -webkit-line-clamp:2;
    overflow:hidden;
    cursor:pointer;
  }
  .sheet.res p.res-sum.is-open{-webkit-line-clamp:unset;display:block}
  .res-sumwrap{position:relative}
  .res-sumhint{
    position:absolute;right:0;bottom:0;
    padding:0 0 0 1.6rem;
    font:inherit;font-size:.8rem;font-weight:700;color:var(--accent);
    background:linear-gradient(90deg,transparent,var(--card) 1.2rem);
    border:0;cursor:pointer;
  }
  .res-sumwrap:has(.is-open) .res-sumhint{position:static;display:block;padding:0;background:none}

  .res-bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.5rem 1rem;margin:.8rem 0 .7rem;padding-top:.7rem;border-top:1px solid var(--line)}
  .res-tabs,.res-chips{display:flex;flex-wrap:wrap;gap:.35rem}
  .res-tab,.res-chip{
    font:inherit;
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:.7rem;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    padding:.4rem .75rem;
    color:var(--ink);
    background:transparent;
    border:1px solid var(--line);
    border-radius:999px;
    cursor:pointer;
    transition:background .15s ease,color .15s ease,border-color .15s ease;
  }
  .res-tab:hover,.res-chip:hover{border-color:var(--accent)}
  .res-tab:focus-visible,.res-chip:focus-visible,.res-node:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .res-tab[aria-selected="true"],.res-chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .res-chip{font-size:.66rem;padding:.3rem .6rem;letter-spacing:.05em}

  .res-body{height:calc(100dvh - 27.2rem);min-height:15rem}
  .res-acc,.res-cols{overflow-y:auto;min-height:0;height:100%}
  .res-acc{list-style:none;margin:0;padding:0 .4rem 0 0}
  .res-item{
    margin:0 0 .4rem;
    border:1px solid var(--line);
    border-left:3px solid var(--line);
    transition:background .15s ease,border-color .15s ease,opacity .2s ease;
  }
  .res-item:hover{border-left-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
  .res-item:has(.res-node[aria-expanded="true"]){border-left-color:var(--accent);background:var(--card-hover)}
  .res-item.is-dim{opacity:.35}
  .res-node{
    position:relative;
    display:block;
    width:100%;
    text-align:left;
    font:inherit;
    color:inherit;
    padding:.55rem 2.2rem .55rem .9rem;
    background:transparent;
    border:0;
    cursor:pointer;
  }
  .res-nhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:0 1rem}
  .res-nwhen{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.72rem;font-weight:700;color:var(--ink-soft);white-space:nowrap}
  .res-nrole{font-size:.92rem;font-weight:700;line-height:1.25;color:var(--ink)}
  .res-norg{display:block;font-size:.78rem;color:var(--ink-soft)}
  .res-chev{position:absolute;right:.9rem;top:50%;margin-top:-.55em;font-size:.8rem;color:var(--accent);transition:transform .2s ease}
  .res-node[aria-expanded="true"] .res-chev{transform:rotate(90deg)}
  .res-panel{padding:0 .9rem .7rem}
  .res-panel:not([hidden]){animation:riseIn .25s cubic-bezier(.2,.7,.3,1) both}
  .sheet.res p.res-org{margin:0 0 .5rem;font-size:.86rem;color:var(--ink-soft)}
  .sheet.res p.res-sub{margin:0 0 .15rem;font-size:.8rem;color:var(--ink-soft)}
  .res-sub b{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.7rem;color:var(--ink)}
  .res-tags{display:flex;flex-wrap:wrap;gap:.3rem;margin:.55rem 0 .3rem}
  .res-tag{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.64rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:.15rem .5rem;border-radius:999px;border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));color:var(--accent)}
  .res ul{margin:.4rem 0 0;padding-left:1.1rem;font-size:.85rem;line-height:1.5;color:var(--ink-2,var(--ink-soft))}
  .res li{margin:0 0 .3rem;break-inside:avoid}
  .res-panel ul{column-width:22rem;column-gap:2rem;list-style:disc}
  .res-role{font-weight:700;color:var(--ink)}
  .res-when{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.74rem;font-weight:700;color:var(--ink-soft);white-space:nowrap}

  /* the other three tabs: cards set in columns, so they fit rather than run */
  .res-cols{height:100%;column-width:19rem;column-gap:1.4rem;padding-right:.4rem}
  .res-card{
    break-inside:avoid;
    margin:0 0 .8rem;
    padding:.7rem .9rem;
    border:1px solid var(--line);
    border-left:3px solid var(--accent);
    background:var(--card-hover);
    font-size:.85rem;
    line-height:1.5;
    color:var(--ink-2,var(--ink-soft));
  }
  .res-card b{display:block;color:var(--ink);font-size:.9rem}
  .res-card .res-when{display:block;margin-top:.15rem}
  .res-h{break-inside:avoid;margin:0 0 .5rem;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.7rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}

  @media (max-width:860px){
    .res-body{height:auto}
    .res-acc,.res-cols{overflow:visible;height:auto}
  }

  /* ---------- the spare resume: five sections on one page ---------- */
  .sp{max-width:none;display:flex;flex-direction:column;gap:1rem}
  .sp-nav{
    position:sticky;top:0;z-index:5;
    display:flex;flex-wrap:wrap;gap:.35rem;
    padding:.5rem 0;
    background:var(--ground);
  }
  .sp-nav button{
    font:inherit;font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    flex:1 1 auto;white-space:nowrap;padding:.9rem 1rem;text-align:center;
    color:var(--ink);background:var(--card);
    border:1px solid var(--line);border-radius:999px;cursor:pointer;
    transition:background .15s ease,color .15s ease,border-color .15s ease;
  }
  .sp-nav button:hover{border-color:var(--accent)}
  .sp-nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .sp-nav button[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .sp-sec{
    scroll-margin-top:5rem;
    padding:1.1rem 1.4rem 1.2rem;
    background:var(--card);
    border:1px solid var(--line);
    border-top:3px solid var(--accent);
    border-radius:2px;
    box-shadow:var(--shadow);
  }
  .sp-num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.7rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 .6rem}
  .sp-sec h2{margin:0;font-size:clamp(1.5rem,1.1rem + 1.6vw,2.2rem);font-weight:700;font-stretch:110%;letter-spacing:-.02em;line-height:1.05}
  /* a soft-cornered square for the portrait, ahead of the name; initials show until there is
     a photo.jpg beside the page to cover them */
  .sp-head{
    display:grid;
    grid-template-columns:auto minmax(0,1fr);
    column-gap:1.2rem;
    align-items:start;
  }
  .sp-photo{grid-row:1 / span 2}
  .sp-who{grid-column:2;grid-row:1}
  .sp-row{grid-column:2;grid-row:2;display:flex;flex-wrap:wrap;align-items:stretch;gap:.6rem;margin-top:.55rem}
  .sp-who{min-width:0}
  .sp-photo{
    position:relative;flex:0 0 auto;
    width:6.4rem;height:6.4rem;
    border-radius:1.4rem;
    overflow:hidden;
    border:2px solid var(--accent);
    box-shadow:var(--shadow);
    background:var(--card-hover);
    display:grid;place-items:center;
  }
  .sp-init{font-size:1.8rem;font-weight:700;font-stretch:110%;letter-spacing:.02em;color:var(--accent)}
  .sp-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 25%}
  @media (max-width:520px){.sp-photo{width:5rem;height:5rem;border-radius:1.1rem}}
  .sp-title{margin:.3rem 0 0;font-size:1rem;font-weight:600;color:var(--accent)}
  /* the details box, to the right of the five icons: the text, and a button
     to copy it */
  .sp-open{flex:1 1 14rem;min-width:0;display:flex;align-items:stretch}
  .sp-det{
    flex:1;display:flex;align-items:stretch;min-width:0;
    font-size:.8rem;font-weight:700;line-height:1.4;letter-spacing:.01em;
    color:var(--ink);
    background:var(--card-hover);
    border:1px solid var(--accent);border-radius:4px;
    box-shadow:var(--shadow);
    overflow:hidden;
    animation:riseIn .2s cubic-bezier(.2,.7,.3,1) both;
  }
  .sp-dtext{flex:1;min-width:0;display:flex;align-items:center;padding:.5rem .65rem;overflow-wrap:anywhere}
  .sp-dtext a{color:var(--accent)}
  .sp-copy{
    flex:0 0 auto;display:grid;place-items:center;width:2.6rem;padding:0;
    color:var(--accent);background:transparent;
    border:0;border-left:1px solid var(--line);
    cursor:pointer;
    transition:background .15s ease;
  }
  .sp-copy:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
  .sp-copy:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .sp-copy svg{width:1.3rem;height:1.3rem}
  /* five boxes side by side on the right of the header */
  .sp-icons{display:flex;gap:.3rem;flex:0 0 auto}
  .sp-ico{
    display:grid;place-items:center;
    width:3rem;height:3rem;padding:0;
    color:var(--accent);
    background:var(--card-hover);
    border:1px solid var(--line);border-radius:4px;

    transition:border-color .15s ease,box-shadow .15s ease,background .15s ease;

  .sp-ico:hover,.sp-ico.is-on{border-color:var(--accent);box-shadow:var(--shadow)}
  .sp-ico.is-on{background:color-mix(in srgb,var(--accent) 9%,var(--card-hover))}
  .sp-ico:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (max-width:760px){
    .sp-head{grid-template-columns:auto minmax(0,1fr)}

  }
  .sp-lead{
    margin:.9rem 0 0;padding:.8rem 1rem;
    font-size:1rem;font-style:italic;line-height:1.6;color:var(--ink-2,var(--ink-soft));

  }
  .sp-view:hover,.sp-view:focus-visible{background:color-mix(in srgb,var(--accent) 10%,var(--card-hover))}

  .sp-stats{display:flex;flex-wrap:wrap;gap:.6rem 2rem;margin:1rem 0 0;padding-top:.8rem;border-top:1px solid var(--line)}
  .sp-stat b{display:block;font-size:1.9rem;font-weight:700;line-height:1;font-stretch:110%;color:var(--ink)}
  .sp-stat-map{display:flex;align-items:center;gap:.6rem}

  .sp-map{display:block;height:2.1rem;width:auto;mix-blend-mode:multiply}
  .sp-stat span{display:block;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
  .sp-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:.7rem}
  .sp-edu{grid-template-columns:minmax(0,1fr) minmax(0,max-content)}
  @media (max-width:760px){.sp-edu{grid-template-columns:1fr}}
  .sp-card{
    padding:.7rem .9rem;
    border:1px solid var(--line);border-left:3px solid var(--accent);

  .sp-card em{display:block;margin-top:.15rem;font-style:normal;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.72rem;font-weight:700;color:var(--ink-soft)}
  .sp-h{margin:1rem 0 .5rem;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.7rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  .sp-sec .sp-h:first-of-type{margin-top:0}
  .sp-chips{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.4rem}
  @media (max-width:760px){.sp-chips{grid-template-columns:repeat(auto-fill,minmax(7.6rem,1fr))}}
  .sp-chip{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.68rem;font-weight:700;padding:.4rem .3rem;text-align:center;white-space:nowrap;border:1px solid var(--line);border-radius:999px;color:var(--ink);background:var(--card-hover)}

  /* the employer line: bars drawn to scale, one per stretch of years */
  .sp-line{overflow-x:auto;margin:0 -.2rem .6rem;padding:0 .2rem}

  .sp-logo{position:absolute;right:.8rem;top:.7rem;height:1.6rem;width:auto;max-width:46%;object-fit:contain}

  /* ---------- the groups ----------
     The five groups are the main page and they stay on it: opening one shows

  .groups{

  .group-head::before{

  /* ---------- secondary screen ---------- */

  .list{

  /* two entries per line, each two lines tall — same rhythm as the main menu */

    grid-template-columns:repeat(2,minmax(0,1fr));

  @media (max-width:640px){ .list.two-col{grid-template-columns:1fr} }
  /* every box the height of the tallest */
  .list.two-col{grid-auto-rows:1fr}
  .list.two-col > li{display:flex}
  .list.two-col > li > .row{flex:1;min-width:0}
  /* half a row is narrow: the tag drops under the name instead of pushing it onto two lines */
  .list.two-col .row:not(.compact) .row-tag{display:block;margin:.1rem 0 0;white-space:normal}

  .row{
    display:grid;
    grid-template-columns:minmax(0,1fr) auto;

    gap:.2rem 1.5rem;

    border-radius:2px;

  a.row:hover,a.row:focus-visible{

    border-color:color-mix(in srgb,var(--accent) 45%,var(--line));

  a.row:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .row-name{
    font-size:1.05rem;
    font-weight:600;
    letter-spacing:-.01em;

  .row-tag{
    margin-left:.5em;
    font-size:.84em;
    font-weight:500;
    letter-spacing:0;

  /* One line, and the whole of the line: no measure cap, so a description
     runs to the width the row gives it before anything is cut. */
  .row-desc{
    margin:0;
    font-size:.88rem;
    line-height:1.5;
    color:var(--ink-soft);
    display:-webkit-box;
    -webkit-box-orient:vertical;
    -webkit-line-clamp:1;
    line-clamp:1;

  .row-dest{

  .arrow{
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:1rem;
    line-height:1;
    color:var(--accent);
    transition:transform .2s ease;
  }
  a.row:hover .arrow{transform:translate(3px,-3px)}

  /* compact card: title line, then one description line. Nothing taller. */
  .row.compact{

    flex-direction:column;
    gap:.28rem;
    padding:.9rem 1.1rem;
  }
  .row.compact .row-head{

  .row.empty .row-name{color:var(--ink-soft);font-weight:500}
  .row.empty code{

  }

  .bar-btn{
    font-family:"IBM Plex Mono",ui-monospace,monospace;

    font-weight:700;

    text-transform:uppercase;
    color:var(--btn-ink);
    background:var(--btn);
    border:1px solid var(--btn);
    border-radius:999px;
    padding:.5rem 1.5rem;
    min-width:11rem;
    max-width:100%;

    transition:background .18s ease,border-color .18s ease,transform .18s ease;
  }
  @media (max-width:640px){

  .bar-btn:hover,.bar-btn:focus-visible{

    border-color:var(--btn-hover);
    transform:translateY(-2px);
  }
  .bar-btn:focus-visible{outline:3px solid var(--btn);outline-offset:3px}

  /* ---------- modals ---------- */
  .modal{

    box-shadow:var(--shadow);

  }
  .modal::backdrop{background:rgba(28,20,10,.45)}
  .modal form,.modal .pad{padding:1.5rem 1.6rem}
  .modal-title{
    margin:0 0 .3rem;
    font-size:1.2rem;
    font-weight:700;
    font-stretch:105%;

  .field{display:flex;flex-direction:column;gap:.3rem;margin-bottom:.75rem}
  .field label{

  .field input,.field textarea{

  }

  .field input:focus,.field textarea:focus{

  }
  .modal-actions{display:flex;justify-content:flex-end;gap:.6rem;margin-top:.85rem}
  .btn{
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:.7rem;
    font-weight:700;
    letter-spacing:.12em;
    text-transform:uppercase;

    border-radius:999px;
    border:1px solid var(--line);

  }
  .btn:hover{color:var(--ink)}
  .btn.primary{

  .link-row{

  /* ---------- the logo screen ----------
     The mark assembles itself. A dot opens out into a globe filling the
     stage, shrinks back past its resting size to a dot with a B inside it,
     grows again to settle, and then DU and AI arrive on either side of it.
     CAN comes last, up from below.

     A circle here is a circle from the first frame to the last: nothing is
     ever squashed, flattened or boxed. Every stage is a class added in turn,
     so the browser interpolates between them. */
  .logo-pane{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:1.1rem;
  }
  .logo-stage{
    --gd:min(48vmin,22rem);          /* the globe at its hugest */
    position:relative;
    width:100%;
    min-height:min(56vh,25rem);
    display:flex;
    align-items:center;
    justify-content:center;
    /* DU and AI wait outside this box. Clipped, so they are not visible out
       there and do not put a scrollbar on the page while they wait. */
    overflow:hidden;
  }
  /* except on the way up, where the mark has to leave the box entirely */
  .logo-stage.is-flying{overflow:visible}
  /* Replaying means going back to the start. Without this the finished mark
     would animate itself apart first. */
  .logo-stage.no-anim *{transition:none !important}

  .lg-globe{
    position:absolute;
    left:50%;
    top:50%;
    width:var(--gd);
    height:var(--gd);
    margin:calc(var(--gd) / -2) 0 0 calc(var(--gd) / -2);
    opacity:0;
    /* Laid out at its largest and only ever scaled down, so the artwork is
       never asked to enlarge. Every stage writes the same two functions, so
       they interpolate one for one rather than falling back to matrices.
       It opens at the size it will finish at — the dot — which is the same
       measured scale the end of the sequence returns to. */
    transform:translate(0,0) scale(var(--ts,.06));
  }
  .lg-globe svg,.lg-b-globe svg{display:block;width:100%;height:100%}

  /* 1 — a dot, and nothing else */
  .is-seed .lg-globe{
    opacity:1;
    transform:translate(0,0) scale(var(--ts,.06));
    transition:opacity .35s ease;
  }
  /* 2 — out to full size, filling the stage */
  .is-huge .lg-globe{
    opacity:1;
    transform:translate(0,0) scale(1);
    transition:transform 1s cubic-bezier(.25,.7,.3,1);
  }
  /* 3 — in to the size of a letter, which is where the word reads DUBAI.
     Measured in the script: the slot is a character in a line of type, and
     no stylesheet can know where the line of type has put it. */
  .is-word .lg-globe{
    opacity:1;
    transform:translate(var(--lx,0px),var(--ly,0px)) scale(var(--ls,.2));
    transition:transform 1s cubic-bezier(.5,0,.2,1);
  }
  /* 4 — and on down to a dot, smaller than it will end up */
  .is-small .lg-globe{
    opacity:1;
    transform:translate(var(--tx,0px),var(--ty,0px)) scale(calc(var(--ts,.06) * .72));
    transition:transform 1.05s cubic-bezier(.5,0,.18,1);
  }
  /* 5 — and back up, to settle at the size it keeps */
  .is-grown .lg-globe{
    transform:translate(var(--tx,0px),var(--ty,0px)) scale(var(--ts,.06));
    transition:transform .5s cubic-bezier(.3,1.5,.5,1);
  }
  /* 6 — landed. The copy that lives inside the word takes over, so from here
     the dot reflows with the type like any other character. */
  .is-land .lg-globe{opacity:0;transition:opacity .1s linear}
  .is-land .lg-b-globe{opacity:1;transition:opacity .1s linear}

  /* No size of its own: the masthead sets one and the landing page sets a
     much larger one, and everything inside the mark is in em of it.

     inline-flex, and that matters. On the landing page this is a flex item,
     so its box is exactly the word's box. In the masthead it would otherwise
     be a plain inline box, which is sized by the line rather than by what is
     in it: 42px tall around a 39.2px word, with the word sitting 2px down
     inside it. The flight lines the two boxes up, so that difference landed
     the word 2px high and it dropped into place at the swap. As a flex
     container in both places, the box is the word in both places. */
  .lg-mark{
    position:relative;
    display:inline-flex;
    align-items:center;
    font-weight:700;
    font-stretch:125%;
    line-height:1;
    color:var(--mark-ink);
  }
  .logo-stage .lg-mark{font-size:clamp(2.1rem,9.5vmin,5.2rem)}
  .lg-word{
    display:inline-flex;
    align-items:center;
    letter-spacing:.12em;
  }
  /* DU and AI hold their places from the first frame — invisible, but taking
     up room — so the slot can be measured before either of them is shown and
     nothing shifts when they arrive.

     They come in from the far side of each other: DU from the right of the
     screen to its place on the left of the globe, AI from the left to its
     place on the right, crossing over as they pass it. The distance is in em
     of the mark, so it is off the edge at any size rather than off the edge
     at one size and halfway across at another. */
  .lg-side{
    opacity:0;
    transform:translateX(-10em);           /* AI, waiting off to the left */
  }
  .lg-side.lg-du{transform:translateX(10em)}
  .is-word .lg-side{
    opacity:1;
    transform:none;
    transition:opacity .35s ease,transform 1.5s cubic-bezier(.24,.7,.26,1);
  }
  .is-word .lg-du{transition-delay:0s}
  .is-word .lg-ai{transition-delay:.06s}

  /* The slot the globe comes to rest in, and it has two sizes.

     It starts as a letter: .95em across, which is what it takes for a circle
     to hold a capital B rather than crop it — a B is .72em tall and about
     .62em wide, and the diagonal of that is .95. At that size the word reads
     DUBAI. It ends as the dot the masthead carries, and DU and AI close the
     gap between them as it shrinks.

     Both sizes have to be measured, since the globe is not in the line of
     type and has to be told where the line of type has put its slot. */
  .lg-b{
    position:relative;
    top:-.06em;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:.95em;
    height:.95em;
    margin:0;
    border-radius:50%;
  }
  .lg-b-globe{position:absolute;inset:0;border-radius:50%;overflow:hidden;opacity:0}
  /* Reads over the pale ocean and the dark land alike: a soft halo rather
     than a plate behind it, which would put a box inside the circle. */
  .lg-b > .lg-letter{
    position:relative;
    z-index:1;
    font-size:1em;
    font-stretch:100%;
    letter-spacing:0;
    line-height:1;
    color:var(--mark-ink);
    /* A halo rather than a plate behind it, which would put a box inside the
       circle. Tight at this size: the letter is nearly as wide as the globe,
       so it needs an edge to sit on, not a glow — in em, a generous one here
       would be thirty pixels of white and would bleach the globe out. */
    text-shadow:0 0 .045em rgba(255,255,255,.92),0 0 .09em rgba(255,255,255,.6);
    opacity:0;
  }
  /* It is there for the word DUBAI, and stays for everything after it */
  .is-word .lg-b > .lg-letter{
    opacity:1;
    transition:opacity .5s ease .25s;
  }
  /* Down to the dot, the slot, the letter and the globe on one undershoot,
     then all three settle together. The letter is sized off the slot rather
     than transformed, so it stays a letter in a line of type. */
  .is-small .lg-b{
    width:calc(.4em * .72);
    height:calc(.4em * .72);
    top:.02em;
    margin:0 .05em;
    transition:width 1.05s cubic-bezier(.5,0,.18,1),
               height 1.05s cubic-bezier(.5,0,.18,1),
               top 1.05s cubic-bezier(.5,0,.18,1),
               margin 1.05s cubic-bezier(.5,0,.18,1);
  }
  /* Once it is a fifth of the size, over a globe a fifth of the size, it
     needs the glow back — proportionally far more of it. */
  .is-small .lg-b > .lg-letter{
    font-size:calc(.17em * .72);
    text-shadow:0 0 .18em #fff,0 0 .4em rgba(255,255,255,.85);
    transition:font-size 1.05s cubic-bezier(.5,0,.18,1),
               text-shadow 1.05s ease;
  }
  .is-grown .lg-b{
    width:.4em;
    height:.4em;
    transition:width .5s cubic-bezier(.3,1.5,.5,1),
               height .5s cubic-bezier(.3,1.5,.5,1);
  }
  .is-grown .lg-b > .lg-letter{
    font-size:.17em;
    transition:font-size .5s cubic-bezier(.3,1.5,.5,1);
  }

  /* CAN arrives below the word, ranged right with it, then travels up and
     across to sit above it ranged left. Its resting place is the one in the
     stylesheet; the arrival is a transform off it, measured in the script. */
  .lg-can{
    position:absolute;
    left:0;
    bottom:100%;
    margin-bottom:.1em;
    font-size:.33em;
    font-stretch:110%;
    letter-spacing:.18em;
    opacity:0;
    transform:translate(var(--cx,0px),var(--cy,0px));
  }
  .is-can .lg-can{
    opacity:1;
    transition:opacity .45s ease;
  }
  .is-done .lg-can{
    opacity:1;
    transform:translate(0,0);
    transition:transform .85s cubic-bezier(.35,.9,.3,1),opacity .3s ease;
  }
  /* ---- the byline, written once the mark is finished ----
     The fifteen letters are written out in alphabetical order, then two of
     them trade places every beat. A letter that lands in its own column
     turns green and stops moving, so the name assembles itself out of the
     letters it was given. Centred on the mark: the strip is a fixed sixteen
     columns wide, so centring the strip centres the name. */
  .lg-by{
    position:absolute;
    top:100%;
    left:50%;
    margin-top:.5em;
    /* Centred on the word's ink, not on its box. The word carries tracking
       after its last letter, which the box includes and the eye does not, so
       centring on the box leaves the name sitting half that much to the
       right; the nudge is measured and takes it back. */
    transform:translateX(calc(-50% + var(--nudge,0px)));
    display:flex;
    justify-content:center;
    font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:.32em;
    font-weight:700;
    line-height:1;
    white-space:nowrap;
    /* the brown the mark is set in, warmed a little: at this size the near
       black of the big letters reads as black rather than as brown */
    color:#5A3D1C;
    opacity:0;
  }
  .is-by .lg-by{opacity:1;transition:opacity .5s ease}
  /* Monospaced, so a column is a column whatever letter is standing in it.
     The letters are laid out on top of one another and moved by transform:
     they have to be able to pass through each other, which they cannot do
     while they are taking up room in a line. */
  .by-slots{
    --sw:.78em;
    position:relative;
    display:block;
    width:calc(16 * var(--sw));
    height:1em;
  }
  .by-l{
    position:absolute;
    left:0;
    top:0;
    width:var(--sw);
    text-align:center;
    opacity:0;
    transform:translateX(calc(var(--i,0) * var(--sw)));
    /* short, because there are a good many swaps to get through before the
       name is finished and each one has to land before the next is called —
       and at twice the old pace, shorter still */
    transition:transform .05s cubic-bezier(.4,0,.2,1),color .07s ease;
  }
  /* Written on one letter at a time, left to right across the columns. Only
     the fade is staggered — a delay on the transform would hold a letter
     back mid-swap for the rest of the sequence. */
  .is-letters .by-l{
    opacity:1;
    transition:transform .05s cubic-bezier(.4,0,.2,1),
               color .07s ease,
               opacity .3s ease calc(var(--d,0) * 80ms);
  }
  /* Home, and staying there. Green, and dark enough to hold 5.3:1 on the
     sand. */
  .by-l.is-home{color:#17612f}

  /* The finished mark with no story attached: what the masthead carries,
     and where the landing page leaves off. */
  .is-set .lg-side{opacity:1;transform:none}
  .is-set .lg-b{width:.4em;height:.4em;top:.02em;margin:0 .05em}
  .is-set .lg-b > .lg-letter{
    opacity:1;
    font-size:.17em;
    text-shadow:0 0 .18em #fff,0 0 .4em rgba(255,255,255,.85);
  }
  .is-set .lg-b-globe{opacity:1}
  .is-set .lg-can{opacity:1;transform:translate(0,0)}
  .is-set .lg-by{opacity:1}
  .is-set .by-l{opacity:1}

  /* Landing: until the mark has drawn itself the masthead is empty and the
     bar at the foot is out of the way. */
  .is-intro .masthead .lg-mark{opacity:0}
  /* The fade lives on the buttons themselves, not on a landed state, so it
     still runs when the intro class comes off and the rule below stops
     applying. */
  .top-left,.top-right{transition:opacity .5s ease}
  .is-intro .top-left,
  .is-intro .top-right{opacity:0;pointer-events:none}
  .is-intro .lg-replay{display:none}
  /* on the way up it stops being a puzzle and goes back to being a name */
  .is-flying .by-l.is-home{color:inherit;transition:color .7s ease}

  .lg-replay{align-self:center}

  /* ---------- motion ---------- */
  @keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .anim > *{animation:riseIn .5s cubic-bezier(.2,.7,.3,1) both}
  .anim > *:nth-child(1){animation-delay:.02s}
  .anim > *:nth-child(2){animation-delay:.08s}
  .anim > *:nth-child(3){animation-delay:.14s}
  .anim > *:nth-child(4){animation-delay:.20s}
  .anim > *:nth-child(5){animation-delay:.26s}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none !important;transition:none !important}
    /* One exception, and only for the hand-over from the middle of the page
       to the masthead: the preference is about movement, and this is a
       cross-fade between two things that never move. */
    .is-intro .masthead .lg-mark,
    .is-intro .logo-stage .lg-mark{transition:opacity .4s ease !important}
  }
</style>
</head>

// one row per role in RESUME.jobs, in the same order
const RES_JOB_TAGS = [
  ["ai", "gov", "pm"], ["gov", "pm", "dc", "tel"], ["tel"], ["tel"], ["tel"],
  ["tel"], ["tel"], ["dc"]
];
const RES_TABS = [
  ["exp", "Experience"], ["str", "Strengths"], ["ach", "Achievements"], ["edu", "Education"]
];

/* One screen, with its state in the closure: which tab, which role, which
   filter. Every click redraws the body and nothing else. */
function renderResume() {
  document.title = "Resume (alternate) — Can-Du-AI";
  const R = RESUME;
  const st = { tab: "exp", open: new Set([0]), tag: "all", sum: false };
  const hits = (i) => st.tag === "all" || RES_JOB_TAGS[i].indexOf(st.tag) >= 0;
  const list = (a) => "<ul>" + a.map((t) => "<li>" + esc(t) + "</li>").join("") + "</ul>";
  const cards = (a) => a.map((t) => '<div class="res-card">' + esc(t) + "</div>").join("");

  view.innerHTML =
    '<div class="pane"><div class="sheet res" style="--accent:var(--c-enterprise)">' +
      '<div class="res-top"><div><h2>' + esc(ME.name) + "</h2>" +
        '<p class="res-creds">' + esc(R.creds) + "</p></div>" +
        '<div class="res-contact"><a href="mailto:' + ME.email + '">' + esc(ME.email) + "</a>" +
        '<a href="tel:' + ME.tel + '">' + esc(ME.phone) + "</a></div></div>" +
      '<div class="res-sumwrap"><p class="res-sum" id="resSum">' + esc(R.summary) + "</p>" +
      '<button type="button" class="res-sumhint" id="resMore" aria-expanded="false">Read more</button></div>' +
      '<div class="res-bar"><div class="res-tabs" role="tablist" id="resTabs"></div>' +
        '<div class="res-chips" id="resChips" role="group" aria-label="Filter roles by theme"></div></div>' +
      '<div class="res-body" id="resBody"></div>' +
    "</div></div>";

  const $ = (id) => document.getElementById(id);

  function drawBar() {
    $("resTabs").innerHTML = RES_TABS.map((t) =>
      '<button type="button" class="res-tab" role="tab" data-tab="' + t[0] +
        '" aria-selected="' + (st.tab === t[0]) + '">' + esc(t[1]) + "</button>").join("");
    $("resChips").hidden = st.tab !== "exp";
    $("resChips").innerHTML = Object.keys(RES_TAGS).map((k) => [k, RES_TAGS[k]])
      .map((c) => '<button type="button" class="res-chip" data-tag="' + c[0] +
        '" aria-pressed="' + (st.tag === c[0]) + '">' + esc(c[1]) + "</button>").join("");
  }

  function drawBody() {
    const body = $("resBody");
    if (st.tab === "exp") {
      const acc = R.jobs.map((j, i) => {
        const open = st.open.has(i);
        return '<li class="res-item' + (hits(i) ? "" : " is-dim") + '"><button type="button" class="res-node" data-job="' + i +
          '" aria-expanded="' + open + '" aria-controls="resP' + i + '"><span class="res-nhead"><span class="res-nrole">' +
          esc(j.role) + '</span><span class="res-nwhen">' + esc(j.when) + '</span></span><span class="res-norg">' +
          esc(j.org) + '</span><span class="res-chev" aria-hidden="true">&#9654;</span></button>' +
          '<div class="res-panel" id="resP' + i + '"' + (open ? "" : " hidden") + ">" +
          (j.posts ? j.posts.map((p) => '<p class="res-sub"><b>' + esc(p[0]) + "</b> · " + esc(p[1]) + "</p>").join("") : "") +
          '<div class="res-tags">' + RES_JOB_TAGS[i].map((k) => '<span class="res-tag">' + esc(RES_TAGS[k]) + "</span>").join("") + "</div>" +
          list(j.points) + "</div></li>";
      }).join("");
      body.innerHTML = '<ol class="res-acc" aria-label="Roles, newest first">' + acc + "</ol>";
    } else if (st.tab === "str") {
      body.innerHTML = '<div class="res-cols">' + cards(R.strengths) + "</div>";
    } else if (st.tab === "ach") {
      body.innerHTML = '<div class="res-cols">' + cards(R.achievements) + "</div>";
    } else {
      body.innerHTML = '<div class="res-cols"><h3 class="res-h">Education</h3>' +
        R.education.map((e) => '<div class="res-card"><b>' + esc(e[1]) + "</b>" + esc(e[2]) +
          '<span class="res-when">' + esc(e[0]) + "</span></div>").join("") +
        '<h3 class="res-h">Training</h3>' + cards(R.training) + "</div>";
    }
  }

  function draw() { drawBar(); drawBody(); }

  const sheet = view.querySelector(".sheet");
  sheet.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) { if (e.target.id === "resSum") $("resMore").click(); return; }
    if (b.dataset.tab) { st.tab = b.dataset.tab; draw(); return; }
    if (b.dataset.tag) {
      st.tag = st.tag === b.dataset.tag ? "all" : b.dataset.tag;
      draw();
      return;
    }
    if (b.dataset.job) {
      const i = Number(b.dataset.job);
      const open = !st.open.has(i);
      if (open) st.open.add(i); else st.open.delete(i);
      b.setAttribute("aria-expanded", String(open));
      $("resP" + i).hidden = !open;
      return;
    }
    if (b.id === "resMore") {
      st.sum = !st.sum;
      $("resSum").classList.toggle("is-open", st.sum);
      b.textContent = st.sum ? "Show less" : "Read more";
      b.setAttribute("aria-expanded", String(st.sum));
    }
  });
  // up and down walk the list of roles without leaving the keyboard
  sheet.addEventListener("keydown", (e) => {
    if (!e.target.dataset || e.target.dataset.job === undefined) return;
    const step = e.key === "ArrowDown" ? 1 : e.key === "ArrowUp" ? -1 : 0;
    if (!step) return;
    e.preventDefault();
    const to = view.querySelector('[data-job="' + (Number(e.target.dataset.job) + step) + '"]');
    if (to) to.focus();
  });

  draw();
}

/* The portfolio is the five groups, and it stays one page: opening one
   shows its projects under its own row instead of taking the screen away.
   The hash still carries which is open, so a link to a group still works and
   the browser's back button still closes it. */
function renderGroups(openKey) {
  document.title = "My AI Portfolio — Can-Du-AI";

  const groups = ORDER.map((key) => {
    const cat = SITE[key];
    const open = key === openKey;
    const compact = !!cat.compact;
    const rows = cat.items.length
      ? cat.items.map((item) => projectRow(item, compact)).join("")
      : emptyRow(key);
    return '<section class="group' + (open ? " is-open" : "") +
        '" style="--accent:' + cat.accent + '">' +
        '<button type="button" class="group-head" data-key="' + key + '"' +
          ' aria-expanded="' + (open ? "true" : "false") +
          '" aria-controls="g-' + key + '">' +
          '<span class="group-title">' + esc(cat.title) + '</span>' +
          '<span class="group-mark" aria-hidden="true">' +
            (open ? "&#9660;" : "&#9654;") + '</span>' +
        '</button>' +
        // rendered either way, so the button always controls something real
        '<div class="group-body" id="g-' + key + '"' + (open ? "" : " hidden") + '>' +
          '<ul class="list two-col">' + rows + '</ul>' +
        '</div>' +
      '</section>';
  }).join("");

  view.innerHTML = '<div class="pane"><div class="groups">' + groups + '</div></div>';

  view.querySelectorAll(".group-head").forEach((head) => {
    head.addEventListener("click", () => {
      // through the hash, so closing is a step back rather than a dead end
      location.hash =
        head.dataset.key === openKey ? "#/portfolio" : "#/" + head.dataset.key;
    });
  });
}

function projectRow(item, compact) {
  const live = item.status === "live";
  const badge = live
    ? '<span class="badge live">' + (item.label || (item.external ? "Live &middot; External" : "Live")) + '</span>'
    : '<span class="badge">' + (item.label || "In build") + '</span>';

  // Part of the label, set lighter so the name still reads as the name
  const note = item.note ? '<span class="row-tag">' + esc(item.note) + '</span>' : '';

  const inner = compact
    ? '<div class="row-head">' +
        '<p class="row-name">' + esc(item.name) + note + '</p>' + badge +
      '</div>' +
      '<p class="row-desc">' + esc(item.desc) + '</p>'
    : '<div>' +
        '<p class="row-name">' + esc(item.name) + note + '</p>' +
        '<p class="row-desc">' + esc(item.desc) + '</p>' +
      '</div>' +
      '<div class="row-meta">' + badge + (live ? '<span class="arrow">&#8599;</span>' : '') + '</div>' +
      '<p class="row-dest">' + esc(item.dest) + '</p>';

  const cls = compact ? "row compact" : "row";
  const tip = compact ? ' title="' + esc(item.dest) + '"' : '';

  if (!live) return '<li><div class="' + cls + '"' + tip + '>' + inner + '</div></li>';
  const target = item.external ? ' target="_blank" rel="noopener"' : '';
  return '<li><a class="' + cls + '" href="' + esc(item.href) + '"' + target + tip + '>' + inner + '</a></li>';
}

function emptyRow(key) {
  return '<li><div class="row empty">' +
    '<div>' +
      '<p class="row-name">Nothing published here yet</p>' +
      '<p class="row-desc">Add entries to the <code>' + esc(key) + '</code> list in index.html.</p>' +
    '</div>' +
    '<div class="row-meta"><span class="badge">Empty</span></div>' +
    '</div></li>';
}

/* ---------------- the logo, assembling itself ----------------
   Six stages, each a class on the stage. The CSS holds every value except
   the two that can only be measured: where the dot sits inside the line of
   type, and how far CAN has to travel to get above it. */
let logoTimers = [];
let byTimer = 0;
const clearLogo = () => {
  logoTimers.forEach(clearTimeout);
  logoTimers = [];
  // The shuffle reschedules itself for as long as the screen is open, so it
  // is held on its own rather than piling up in the list above.
  clearTimeout(byTimer);
  byTimer = 0;
};

/* Where the globe has to stop, both times, and where CAN comes in from.

   Called again in the gap between the globe finishing its growth and the
   word arriving: by then the webfont has landed, and every one of these
   numbers comes from the metrics of a typeface. Doing it in a gap matters —
   the reading needs transitions off for a moment, and that would cut short
   any that were running. */
function measureLogo(stage) {
  const slot = stage.querySelector(".lg-b");
  const globe = stage.querySelector(".lg-globe");
  const mark = stage.querySelector(".lg-mark");
  const can = stage.querySelector(".lg-can");
  if (!slot || !globe || !mark || !can) return;

  const box = stage.getBoundingClientRect();
  const size = globe.offsetWidth || 1;
  const put = (rect, px, py, ps) => {
    globe.style.setProperty(px,
      (rect.left + rect.width / 2 - (box.left + box.width / 2)).toFixed(2) + "px");
    globe.style.setProperty(py,
      (rect.top + rect.height / 2 - (box.top + box.height / 2)).toFixed(2) + "px");
    globe.style.setProperty(ps, (rect.width / size).toFixed(4));
  };

  // the slot at letter size, which is the stylesheet's default
  put(slot.getBoundingClientRect(), "--lx", "--ly", "--ls");

  /* And the slot once it has shrunk to a dot. That layout has to be put in
     place to be read, so it is applied with transitions off and taken back
     within the same task — nothing is painted in between. It is also the
     layout CAN is measured against, since the word is narrower by then. */
  const held = stage.classList.contains("no-anim");
  stage.classList.add("no-anim", "is-small", "is-grown");
  void stage.offsetWidth;
  put(slot.getBoundingClientRect(), "--tx", "--ty", "--ts");
  fitName(mark);                             // against the word at its final width

  /* Where CAN comes in: below the word, its right edge against the word's.
     Taken from the layout box rather than getBoundingClientRect, because the
     rect already carries the translation these very properties apply — read
     that way, a second run measures its own answer and lands on zero. */
  const em = parseFloat(getComputedStyle(mark).fontSize) || 0;
  const below = parseFloat(getComputedStyle(can).marginBottom) || 0;
  can.style.setProperty("--cx", (mark.offsetWidth - can.offsetWidth).toFixed(2) + "px");
  can.style.setProperty("--cy",
    (mark.offsetHeight + can.offsetHeight + below + em * 0.16).toFixed(2) + "px");

  stage.classList.remove("is-small", "is-grown");
  void stage.offsetWidth;
  if (!held) stage.classList.remove("no-anim");
}

/* The name, refusing to settle.

   Letters are judged by their character and not by which span they are: to
   anyone reading, the three As are the same A, and one of them standing in
   an A's column is that column answered. Nothing is ever locked in place —
   a solved letter is swapped away again like any other, which is what keeps
   the name a puzzle rather than a slow reveal. */
const BY_NAME = "HUSAM ALQAWASMEH";

function byCells() {
  let out = "", col = 0;
  for (const ch of BY_NAME) {
    if (ch !== " ") {
      out += '<span class="by-l" data-c="' + ch + '" style="--i:' + col + '">' + ch + '</span>';
    }
    col++;                                   // the space is a column no letter uses
  }
  return out;
}

/* The mark, written in one place. The masthead carries it finished; the
   landing page builds it. The only difference is the travelling globe, which
   belongs to the animation and so is not part of this. */
function markHTML(id, extra) {
  return '<span class="lg-mark' + (extra ? " " + extra : "") + '"' +
      (id ? ' id="' + id + '"' : "") + ' aria-hidden="true">' +
      '<span class="lg-can">CAN</span>' +
      '<span class="lg-word">' +
        '<span class="lg-side lg-du">DU</span>' +
        '<span class="lg-b">' +
          '<span class="lg-letter">B</span>' +
          '<span class="lg-b-globe"><svg viewBox="0 0 200 200">' +
            '<use href="#cdaGlobe"/></svg></span>' +
        '</span>' +
        '<span class="lg-side lg-ai">AI</span>' +
      '</span>' +
      '<span class="lg-by">' +
        '<span class="by-slots">' + byCells() + '</span>' +
      '</span>' +
    '</span>';
}

/* The name is set to the width of the word above it.

   Sixteen columns of equal width with the letters centred in them: the ink
   starts half a column in and stops half a column short, so for the ink
   itself to measure the same as the word, the columns have to come to a
   glyph less than the word rather than to the word. */
function fitName(mark) {
  if (!mark) return;
  const word = mark.querySelector(".lg-word");
  const by = mark.querySelector(".lg-by");
  const slots = mark.querySelector(".by-slots");
  if (!word || !by || !slots) return;

  const probe = document.createElement("span");
  probe.textContent = "M";
  probe.style.cssText = "position:absolute;visibility:hidden;white-space:pre";
  by.appendChild(probe);
  const glyph = probe.getBoundingClientRect().width;
  probe.remove();

  // the word carries tracking after its last letter, which is not ink
  const trailing = parseFloat(getComputedStyle(word).letterSpacing) || 0;
  const w = word.getBoundingClientRect().width - trailing;
  if (!w || !glyph) return;

  /* Set in em of the byline rather than in pixels. Both marks are then the
     same shape at two sizes rather than two shapes that happen to agree at
     one, which is what lets the one flown up the page and the one waiting in
     the masthead be swapped without anything moving. */
  const em = parseFloat(getComputedStyle(by).fontSize) || 0;
  if (!em) return;
  slots.style.setProperty("--sw", ((w - glyph) / 15 / em).toFixed(5) + "em");
  by.style.setProperty("--nudge", (-trailing / 2 / em).toFixed(5) + "em");
}

function startByline(stage, shuffle, onSolved) {
  const slots = stage.querySelector(".by-slots");
  if (!slots) return;
  const letters = Array.prototype.slice.call(slots.querySelectorAll(".by-l"));
  if (!letters.length) return;

  const want = {};                           // want[column] = the letter it wants
  let col = 0;
  for (const ch of BY_NAME) { if (ch !== " ") want[col] = ch; col++; }

  const at = letters.map((el) => Number(el.style.getPropertyValue("--i")));

  /* A letter that reaches its own column is done with: it turns green and is
     taken out of the draw, so it cannot be swapped away again. Which means
     the name does assemble itself, one letter at a time, out of the letters
     it was given.

     Judged by character rather than by which span it is — to a reader the
     four As are the same A, so any of them standing in an A's column answers
     it. The last letter needs no luck: once fourteen columns are right the
     fifteenth has nowhere else to be. */
  const locked = letters.map(() => false);

  const place = () => letters.forEach((el, k) => {
    el.style.setProperty("--i", String(at[k]));
    if (want[at[k]] === el.dataset.c) locked[k] = true;
    el.classList.toggle("is-home", locked[k]);
  });

  if (!shuffle) { place(); return; }         // motion turned down: leave it read

  /* It does not open on a scatter. The letters are written out in
     alphabetical order — AAAAE HHLMMQSSUW — which shows the reader what
     there is to work with before any of it starts moving. */
  const cols = [];
  let n = 0;
  for (const ch of BY_NAME) { if (ch !== " ") cols.push(n); n++; }
  letters
    .map((el, k) => k)
    .sort((a, b) => (letters[a].dataset.c < letters[b].dataset.c ? -1 : 1))
    .forEach((k, rank) => { at[k] = cols[rank]; });
  place();

  /* Written out left to right: each letter is told how many places along the
     line it is, and the stylesheet turns that into its own delay. */
  // (in alphabetical order this is simply left to right)
  letters
    .map((el, k) => ({ el, col: at[k] }))
    .sort((a, b) => a.col - b.col)
    .forEach((item, rank) => item.el.style.setProperty("--d", String(rank)));

  const swap = () => {
    const free = [];
    for (let k = 0; k < letters.length; k++) if (!locked[k]) free.push(k);
    if (free.length < 2) {                   // the name is finished
      if (onSolved) onSolved();
      return;
    }
    const pick = () => free[Math.floor(Math.random() * free.length)];
    const a = pick();
    let b = pick();
    while (b === a) b = pick();              // free.length is at least two
    const t = at[a]; at[a] = at[b]; at[b] = t;
    place();
    byTimer = setTimeout(swap, 55 + Math.random() * 43);
  };
  // Nothing moves until the last letter has been written
  byTimer = setTimeout(swap, 2100);
}

/* The mark leaves the middle of the page for the masthead, and stays there.

   Both ends are measured and it goes in one transform. The two are the same
   markup at two sizes, so putting one box on the other puts everything
   inside it on everything inside the other. */
function flyToMasthead(stage) {
  const from = stage.querySelector(".lg-mark");
  const to = document.getElementById("mastMark");
  if (!from || !to) return finishIntro(stage);

  const a = from.getBoundingClientRect();
  const b = to.getBoundingClientRect();
  if (!a.width || !b.width) return finishIntro(stage);

  stage.classList.add("is-flying");
  from.style.transformOrigin = "top left";
  from.style.transition = "transform 1.05s cubic-bezier(.5,0,.2,1)";
  from.style.transform =
    "translate(" + (b.left - a.left).toFixed(2) + "px," +
                   (b.top - a.top).toFixed(2) + "px) " +
    "scale(" + (b.width / a.width).toFixed(4) + ")";
  /* On the transition itself rather than on a stopwatch set to the same
     length, so the swap cannot happen a frame before the mark has landed. */
  let landed = false;
  const done = (e) => {
    if (e && e.target !== from) return;        // ignore anything bubbling up
    if (landed) return;
    landed = true;
    from.removeEventListener("transitionend", done);
    finishIntro(stage);
  };
  from.addEventListener("transitionend", done);
  logoTimers.push(setTimeout(done, 1400));     // in case it never fires
}

/* Hand over.

   Swapped in a single frame, not cross-faded. Two copies of the same mark
   fading through each other double every stroke for a quarter of a second,
   and that doubling is what reads as one picture being replaced by another.
   A straight swap between two things drawn the same way shows nothing. */
function finishIntro(stage) {
  introDone = true;
  const from = stage && stage.querySelector(".lg-mark");
  const to = document.getElementById("mastMark");
  if (to) to.style.opacity = "1";
  if (from) from.style.visibility = "hidden";

  logoTimers.push(setTimeout(() => {
    document.body.classList.remove("is-intro");
    if (to) to.style.opacity = "";             // back to the stylesheet's word
    route();                                   // and the front door takes over
  }, 90));
}

function playLogo(intro) {
  clearLogo();
  const stage = document.getElementById("logoStage");
  if (!stage) return;

  /* With motion turned down there is no story to tell, only the mark — but
     it still forms in the middle of the page before it goes up. It arrives
     there whole rather than assembling itself, holds long enough to be read,
     and hands over by fading. What the preference rules out is the
     travelling and the scaling, not the order of events. */
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    stage.className = "logo-stage is-set";
    fitName(stage.querySelector(".lg-mark"));
    if (intro) logoTimers.push(setTimeout(() => finishIntro(stage), 1600));
    return;
  }

  stage.className = "logo-stage no-anim";
  void stage.offsetWidth;                       // commit the reset before animating
  measureLogo(stage);
  stage.classList.remove("no-anim");
  {
    const at = (ms, cls) => logoTimers.push(setTimeout(() => stage.classList.add(cls), ms));
    at(60,   "is-seed");    // a dot, the size the mark ends on
    at(400,  "is-huge");    // out to full size, filling the stage
    // in the gap: the real font is in by now, and every number below comes
    // from its metrics
    logoTimers.push(setTimeout(() => measureLogo(stage), 1380));
    at(1450, "is-word");    // in to letter size — the word reads DUBAI
    // DU and AI are still crossing the screen until 2950; the word wants a
    // moment whole before it starts closing up
    at(3450, "is-small");   // on down to a dot, the B shrinking with it
    at(4550, "is-grown");   // and settled at the size it keeps
    at(5100, "is-land");    // hand over to the copy in the word
    at(5450, "is-can");     // CAN, below the word and ranged right
    at(6100, "is-done");    // up and across, to sit above it ranged left
    /* The name is set against the word as it actually stands, a moment
       before it is shown. Everything that changes the word's width — the
       slot shrinking out of DUBAI, the webfont arriving — is long finished
       by now, and measuring the live layout beats predicting it: the earlier
       reading is taken from a layout applied for a fraction of a second to
       be read, and any difference between that and the real one ends up in
       the name's width. */
    logoTimers.push(setTimeout(() => fitName(stage.querySelector(".lg-mark")), 6950));
    // the letters, alphabetical, written out one at a time
    at(7000, "is-by");
    logoTimers.push(setTimeout(
      () => startByline(stage, true, intro ? () => flyToMasthead(stage) : null), 7060));
    at(7350, "is-letters");
  }
}

function renderLogo(intro) {
  document.title = intro ? "Can-Du-AI" : "The Logo — Can-Du-AI";
  view.innerHTML =
    // no .anim here: this screen is its own entrance, and the pane-level
    // rise would fade the stage in over the top of it
    '<div class="pane logo-pane">' +
      '<div class="logo-stage" id="logoStage" role="img" aria-label="' +
        'The Can-Du-AI mark assembling itself: a dot opens out into a globe ' +
        'turned to the Gulf, shrinks back to a dot with a B inside it, DU ' +
        'and AI arrive on either side, and CAN rises from below the word to ' +
        'sit above it. Underneath, the letters of Husam Al-Qawasmeh are ' +
        'written out in alphabetical order and then shuffle themselves into ' +
        'the name.">' +
        '<span class="lg-globe" aria-hidden="true">' +
          '<svg viewBox="0 0 200 200"><use href="#cdaGlobe"/></svg></span>' +
        markHTML("", "") +
      '</div>' +
      '<button type="button" class="btn lg-replay" id="logoReplay">Play again</button>' +
    '</div>';
  document.getElementById("logoReplay").addEventListener("click", () => playLogo(false));
  playLogo(intro);

  /* The measurements depend on text metrics, so they are taken again once the
     webfont is in. Play is not held back for it: a promise that never settles
     — a slow or blocked font — would otherwise leave the screen empty for
     good, and a retarget mid-flight is only a transition changing its mind. */
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => {
      const stage = document.getElementById("logoStage");
      if (stage) measureLogo(stage);
    });
  }
}

// the way back sits at the left of the top row, and only where there is one;
// with the groups opening in place, it closes whichever one is open
function setBack(href, label) {
  const slot = document.getElementById("backSlot");
  if (!slot) return;
  slot.innerHTML = href
    ? '<a class="crumb" href="' + href + '">' +
        '<span class="crumb-arrow">&larr;</span> ' + esc(label) + '</a>'
    : "";
}

/* The front door is the mark drawing itself, once a visit. Arriving straight
   at a group skips it — an intro belongs to the front door — and so does
   coming back to the groups later. */
let introDone = false;

function route() {
  clearLogo();                                  // leaving the logo screen stops it
  const key = location.hash.replace(/^#\/?/, "").trim();
  const onCategory = Object.prototype.hasOwnProperty.call(SITE, key);
  document.body.classList.toggle("on-resume", key === "resume" || key === "resume/spare");

  if (!introDone && key === "") {
    document.body.classList.add("is-intro");
    setBack(null);
    renderLogo(true);
    return;
  }

  introDone = true;
  document.body.classList.remove("is-intro");

  if (key === "picks/video" || key === "picks/quote") {
    view.classList.remove("centred");
    renderPicks(key.slice(6));
    setBack("#/picks", "Picks");
    view.scrollTop = 0;
    return;
  }

  // The mark's own screen
  if (key === "logo") {
    view.classList.add("centred");
    renderLogo(false);
    setBack("#/", "Back");
    view.scrollTop = 0;
    return;
  }

  if (key === "resume/spare") {
    view.classList.remove("centred");
    renderResume();
    setBack("#/resume", "Resume");
    view.scrollTop = 0;
    return;
  }

  if (key === "resume") {
    view.classList.remove("centred");
    renderSpare();
    setBack("#/", "Back");
    view.scrollTop = 0;
    return;
  }

  const inGroups = key === "portfolio" || (onCategory && !SITE[key].special);
  if (inGroups) {
    view.classList.remove("centred");
    const openKey = key === "portfolio" ? null : key;
    /* Held across the render: opening a group rebuilds the list, and losing
       the scroll position would throw the page back to the top every time
       one of the lower groups was opened. */
    const keep = view.scrollTop;
    renderGroups(openKey);
    // one step back each time: an open group closes, the page returns home
    setBack(openKey ? "#/portfolio" : "#/", openKey ? "All groups" : "Back");
    view.scrollTop = keep;
    return;
  }

  // anything else is the front door, with the contact line open or shut
  view.classList.add("centred");
  renderLanding(key === "picks");
  setBack(null);
  view.scrollTop = 0;
}

/* The masthead's copy of the mark, built from the same function and set to
   its finished state. It has to exist before the landing page can fly its
   own copy into it. */
const mastLink = document.getElementById("mastLink");
if (mastLink) mastLink.innerHTML = markHTML("mastMark", "is-set");

const fitAll = () => {
  fitName(document.getElementById("mastMark"));
  /* The landing page's word is only its final width once the slot has shrunk
     to a dot; before that measureLogo does the fitting, from inside the
     layout it applies to read it. */
  const stage = document.getElementById("logoStage");
  if (stage && (stage.classList.contains("is-grown") ||
                stage.classList.contains("is-set"))) {
    fitName(stage.querySelector(".lg-mark"));
  }
};
fitAll();
window.addEventListener("resize", fitAll);
// the width of a name is the width of a typeface, so it is taken again once
// the real one is in
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);

window.addEventListener("hashchange", route);
route();

/* ---------------- useful links ---------------- */
(function () {
  const modal = document.getElementById("linksModal");
  const list = document.getElementById("linksList");
  if (!modal || typeof modal.showModal !== "function") return;

  list.innerHTML = LINKS.map(l => {
    const host = l.url.replace(/^https?:\/\//, "").replace(/\/$/, "");
    return '<li><a class="link-row" href="' + esc(l.url) + '" target="_blank" rel="noopener">' +
      '<span><p class="link-name">' + esc(l.name) + '</p>' +
      '<p class="link-note">' + esc(l.note) + '</p></span>' +
      '<span class="link-host">' + esc(host) + ' &#8599;</span>' +
      '</a></li>';
  }).join("");

  document.getElementById("linksOpen").addEventListener("click", () => modal.showModal());
  document.getElementById("linksClose").addEventListener("click", () => modal.close());
})();

/* ---------------- leave a comment ----------------
   Posts to /api/comment, which mails it on. If that endpoint is not
   reachable, fall back to the visitor's own mail client so the note is
   never simply lost. */
(function () {
  const OWNER = "husamalqawasmeh@gmail.com";
  const modal = document.getElementById("commentModal");
  const form = document.getElementById("commentForm");
  const thanks = document.getElementById("commentThanks");
  const thanksName = document.getElementById("thanksName");
  const thanksBody = document.getElementById("thanksBody");
  const errorLine = document.getElementById("commentError");
  const sendBtn = document.getElementById("commentSend");

  if (!modal || !form || typeof modal.showModal !== "function") return;

  function reset() {
    form.hidden = false;
    thanks.hidden = true;
    errorLine.hidden = true;
    sendBtn.disabled = false;
    sendBtn.textContent = "Send";
  }

  document.getElementById("commentOpen").addEventListener("click", () => {
    reset();
    modal.showModal();
    document.getElementById("cMessage").focus();
  });
  document.getElementById("commentCancel").addEventListener("click", () => modal.close());
  document.getElementById("commentDone").addEventListener("click", () => modal.close());

  function mailtoFallback(name, email, message) {
    const subject = "Comment from can-du-ai.com" + (name ? " — " + name : "");
    const body =
      message +
      "\n\n—\n" +
      (name ? "From: " + name + "\n" : "") +
      (email ? "Reply to: " + email + "\n" : "");
    window.location.href =
      "mailto:" + OWNER +
      "?subject=" + encodeURIComponent(subject) +
      "&body=" + encodeURIComponent(body);
  }

  function showThanks(name, viaMailClient) {
    thanksName.textContent = name ? ", " + name : "";
    thanksBody.textContent = viaMailClient
      ? "Your mail app is opening with the comment ready — press send there and it reaches Husam."
      : "Your comment is on its way to Husam. It is genuinely appreciated.";
    form.hidden = true;
    thanks.hidden = false;
    document.getElementById("commentDone").focus();
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = document.getElementById("cName").value.trim();
    const email = document.getElementById("cEmail").value.trim();
    const message = document.getElementById("cMessage").value.trim();

    if (!message) {
      errorLine.textContent = "Please write a message before sending.";
      errorLine.hidden = false;
      document.getElementById("cMessage").focus();
      return;
    }

    errorLine.hidden = true;
    sendBtn.disabled = true;
    sendBtn.textContent = "Sending";

    try {
      const res = await fetch("/api/comment", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, email, message })
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok && data.ok) {
        form.reset();
        showThanks(name, false);
        return;
      }
      throw new Error(data.error || "send failed");
    } catch (err) {
      mailtoFallback(name, email, message);
      form.reset();
      showThanks(name, true);
    }
  });
})();
</script>
