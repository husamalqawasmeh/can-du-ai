<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Can-Du-AI — an AI portfolio by Husam Al-Qawasmeh: community apps, commercial apps, enterprise solutions, agent AI, LLM reviews and a tool test lab.">
<!--ARTIFACT-START-->
<title>Can-Du-AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=IBM+Plex+Mono:wght@400;500;700&display=swap">
<style>
  /* One light sand world — no dark variant. Every colour is explicit so the
     page holds its own look whatever theme the browser is set to. */
  :root{
    color-scheme:light;
    --ground:#E7D6B6;
    --ink:#241C10;
    --ink-soft:#655741;
    --line:rgba(36,28,16,.18);
    --card:rgba(255,252,246,.88);
    --card-hover:#FFFDF9;
    --shadow:0 1px 2px rgba(60,44,20,.06), 0 14px 30px -18px rgba(60,44,20,.45);

    /* the three navigation buttons */
    --btn:#1F3A63;
    --btn-hover:#2B4E82;
    --btn-ink:#F6ECD8;

    --c-community:#B25A2A;
    --c-commercial:#2F6F76;
    --c-enterprise:#3A4E7A;
    --c-agents:#4E6B35;
    --c-llm:#7A4468;
    --c-lab:#8A6C1F;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Archivo","Helvetica Neue",Arial,sans-serif;
    color:var(--ink);
    background:var(--ground);
    -webkit-font-smoothing:antialiased;
  }

  /* dunes sit behind everything, pinned to the viewport */
  .dunes{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
  }
  .dunes svg{width:100%;height:100%;display:block}

  /* Masthead and bottom bar are pinned; only the middle pane changes. */
  .page{
    position:relative;
    z-index:1;
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
  }

  /* ---------- masthead (fixed) ---------- */
  .masthead{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding:clamp(1.5rem,4.5vh,2.75rem) 1.5rem .25rem;
  }
  .wordmark{
    display:inline-block;
    font-size:clamp(1.6rem,1.1rem + 2.4vw,2.9rem);
    font-weight:700;
    font-stretch:125%;
    letter-spacing:.12em;
    margin:0;
    line-height:1;
  }
  /* Each separator is a copper disc that reads as a dot from across the room
     and as a letter up close: CAN-ada-DU-B-AI carries CANADA and DUBAI. */
  .wordmark .micro{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:.4em;
    height:.4em;
    margin:0 .05em;
    border-radius:50%;
    background:var(--c-community);
    vertical-align:.14em;
    line-height:1;
    overflow:hidden;
  }
  .wordmark .micro span{
    color:var(--ground);
    font-weight:700;
    font-stretch:100%;
    letter-spacing:0;
    line-height:1;
  }
  .wordmark .micro.ada span{font-size:.115em}
  .wordmark .micro.bee span{font-size:.17em}
  /* width is matched to the wordmark by fitByline() at the foot of the script */
  .byline{
    display:inline-block;
    margin:.85rem 0 0;
    font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:clamp(.92rem,.7rem + .68vw,1.34rem);
    font-weight:700;
    letter-spacing:.1em;
    white-space:nowrap;
    color:var(--ink);
  }

  /* ---------- the pane that changes ---------- */
  main{
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    width:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }
  .pane{
    width:100%;
    max-width:64rem;
    margin:0 auto;
    padding:clamp(1.25rem,3.5vh,2.25rem) 1.5rem;
  }

  /* ---------- category grid ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:.85rem;
  }
  @media (max-width:900px){ .grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
  @media (max-width:600px){ .grid{grid-template-columns:1fr} }

  .tile{
    --accent:var(--ink);
    position:relative;
    display:flex;
    flex-direction:column;
    gap:.5rem;
    padding:1.25rem 1.35rem 1.15rem;
    border:1px solid var(--line);
    border-radius:2px;
    background:var(--card);
    color:inherit;
    text-decoration:none;
    transition:background .22s ease, transform .22s ease, border-color .22s ease, box-shadow .22s ease;
  }
  .tile::before{
    content:"";
    position:absolute;
    left:-1px; top:-1px; bottom:-1px;
    width:2px;
    background:var(--accent);
    transform:scaleY(0);
    transform-origin:top;
    transition:transform .28s cubic-bezier(.2,.7,.3,1);
  }
  .tile:hover,.tile:focus-visible{
    background:var(--card-hover);
    border-color:color-mix(in srgb,var(--accent) 40%,var(--line));
    box-shadow:var(--shadow);
    transform:translateY(-2px);
  }
  .tile:hover::before,.tile:focus-visible::before{transform:scaleY(1)}
  .tile:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

  .tile-title{
    font-size:clamp(1.05rem,.95rem + .35vw,1.3rem);
    font-weight:600;
    font-stretch:105%;
    letter-spacing:-.01em;
    margin:0;
    line-height:1.2;
  }
  /* never taller than two lines, whatever the viewport does to the wrap */
  .tile-desc{
    margin:0;
    font-size:.875rem;
    line-height:1.5;
    color:var(--ink-soft);
    max-width:38ch;
    display:-webkit-box;
    -webkit-box-orient:vertical;
    -webkit-line-clamp:2;
    line-clamp:2;
    overflow:hidden;
  }
  .tile-go{
    margin-top:.2rem;
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:.7rem;
    letter-spacing:.1em;
    color:var(--accent);
    opacity:0;
    transform:translateX(-4px);
    transition:opacity .22s ease, transform .22s ease;
  }
  .tile:hover .tile-go,.tile:focus-visible .tile-go{opacity:1;transform:none}

  /* ---------- secondary screen ---------- */
  .crumb{
    display:inline-flex;
    align-items:center;
    gap:.55rem;
    align-self:flex-start;
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:.84rem;
    font-weight:700;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--btn-ink);
    text-decoration:none;
    padding:.85rem 2rem;
    min-width:13.5rem;
    max-width:100%;
    justify-content:center;
    border:1px solid var(--btn);
    border-radius:999px;
    background:var(--btn);
    box-shadow:var(--shadow);
    transition:background .18s ease,border-color .18s ease,transform .18s ease;
  }
  .crumb:hover,.crumb:focus-visible{
    background:var(--btn-hover);
    border-color:var(--btn-hover);
    transform:translateX(-3px);
  }
  .crumb:focus-visible{outline:3px solid var(--btn);outline-offset:3px}
  .crumb-arrow{
    font-size:1.95em;
    line-height:0;
    font-weight:700;
    position:relative;
    top:.07em;
    transition:transform .18s ease;
  }
  .crumb:hover .crumb-arrow{transform:translateX(-3px)}
  @media (max-width:640px){
    .crumb{min-width:0;width:100%;padding:.85rem 1.5rem}
  }

  .cat-head{margin:1rem 0 0}
  .cat-title{
    font-size:clamp(1.6rem,1.2rem + 1.8vw,2.35rem);
    font-weight:700;
    font-stretch:110%;
    letter-spacing:-.02em;
    line-height:1.05;
    margin:0;
    text-wrap:balance;
  }
  .cat-rule{
    width:3.5rem;height:2px;
    background:var(--accent);
    margin:.7rem 0 .8rem;
  }
  .cat-desc{
    margin:0;
    color:var(--ink-soft);
    font-size:.98rem;
    line-height:1.55;
    max-width:52ch;
  }

  .list{
    list-style:none;
    margin:1.25rem 0 0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:.65rem;
  }
  /* two entries per line, each two lines tall — same rhythm as the main menu */
  .list.two-col{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:.65rem;
  }
  @media (max-width:640px){ .list.two-col{grid-template-columns:1fr} }

  .row{
    display:grid;
    grid-template-columns:minmax(0,1fr) auto;
    align-items:start;
    gap:.2rem 1.5rem;
    padding:1rem 1.3rem;
    border:1px solid var(--line);
    border-radius:2px;
    background:var(--card);
    color:inherit;
    text-decoration:none;
    transition:background .2s ease,border-color .2s ease,transform .2s ease,box-shadow .2s ease;
  }
  a.row:hover,a.row:focus-visible{
    background:var(--card-hover);
    border-color:color-mix(in srgb,var(--accent) 45%,var(--line));
    box-shadow:var(--shadow);
    transform:translateY(-2px);
  }
  a.row:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .row-name{
    font-size:1.05rem;
    font-weight:600;
    letter-spacing:-.01em;
    margin:0 0 .25rem;
  }
  /* project descriptions stay on a single line */
  .row-desc{
    margin:0;
    font-size:.88rem;
    line-height:1.5;
    color:var(--ink-soft);
    max-width:48ch;
    display:-webkit-box;
    -webkit-box-orient:vertical;
    -webkit-line-clamp:1;
    line-clamp:1;
    overflow:hidden;
  }
  .row-dest{
    grid-column:1;
    margin:.5rem 0 0;
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:.72rem;
    color:var(--accent);
    overflow-wrap:anywhere;
  }
  .row-meta{
    grid-column:2;
    grid-row:1 / span 2;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:.5rem;
    white-space:nowrap;
  }
  .badge{
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:.62rem;
    letter-spacing:.13em;
    text-transform:uppercase;
    padding:.28rem .55rem;
    border:1px solid var(--line);
    border-radius:999px;
    color:var(--ink-soft);
  }
  .badge.live{
    color:var(--accent);
    border-color:color-mix(in srgb,var(--accent) 45%,transparent);
  }
  .arrow{
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:1rem;
    line-height:1;
    color:var(--accent);
    transition:transform .2s ease;
  }
  a.row:hover .arrow{transform:translate(3px,-3px)}

  /* compact card: title line, then one description line. Nothing taller. */
  .row.compact{
    display:flex;
    flex-direction:column;
    gap:.28rem;
    padding:.9rem 1.1rem;
  }
  .row.compact .row-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:.75rem;
  }
  .row.compact .row-name{margin:0;font-size:.98rem}
  .row.compact .row-desc{
    max-width:none;
    font-size:.83rem;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .row.compact .badge{flex:0 0 auto}

  .row.empty{border-style:dashed;background:transparent}
  .row.empty .row-name{color:var(--ink-soft);font-weight:500}
  .row.empty code{
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:.85em;
    color:var(--accent);
  }

  /* ---------- bottom bar (fixed) ---------- */
  .bottom-bar{
    flex:0 0 auto;
    display:flex;
    justify-content:center;
    gap:1.1rem;
    flex-wrap:wrap;
    padding:.9rem 1.5rem clamp(1.1rem,3vh,1.75rem);
  }
  .bar-btn{
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:.84rem;
    font-weight:700;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--btn-ink);
    background:var(--btn);
    border:1px solid var(--btn);
    border-radius:999px;
    padding:.85rem 2rem;
    min-width:13.5rem;
    max-width:100%;
    text-align:center;
    cursor:pointer;
    box-shadow:var(--shadow);
    transition:background .18s ease,border-color .18s ease,transform .18s ease;
  }
  @media (max-width:640px){
    .bar-btn{min-width:0;width:100%;padding:.85rem 1.5rem}
  }
  .bar-btn:hover,.bar-btn:focus-visible{
    background:var(--btn-hover);
    border-color:var(--btn-hover);
    transform:translateY(-2px);
  }
  .bar-btn:focus-visible{outline:3px solid var(--btn);outline-offset:3px}

  /* ---------- modals ---------- */
  .modal{
    width:min(32rem,calc(100vw - 2rem));
    max-height:min(80vh,40rem);
    padding:0;
    border:1px solid var(--line);
    border-radius:4px;
    background:var(--ground);
    color:var(--ink);
    box-shadow:var(--shadow);
    overflow:auto;
  }
  .modal::backdrop{background:rgba(28,20,10,.45)}
  .modal form,.modal .pad{padding:1.5rem 1.6rem}
  .modal-title{
    margin:0 0 .3rem;
    font-size:1.2rem;
    font-weight:700;
    font-stretch:105%;
    letter-spacing:-.01em;
  }
  .modal-note{margin:0 0 1rem;font-size:.86rem;line-height:1.5;color:var(--ink-soft)}

  .field{display:flex;flex-direction:column;gap:.3rem;margin-bottom:.75rem}
  .field label{
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:.65rem;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .field input,.field textarea{
    font:inherit;
    font-size:.92rem;
    color:var(--ink);
    background:var(--card-hover);
    border:1px solid var(--line);
    border-radius:2px;
    padding:.55rem .7rem;
    width:100%;
  }
  .field textarea{resize:vertical;min-height:5rem;line-height:1.5}
  .field input:focus,.field textarea:focus{
    outline:2px solid var(--c-community);
    outline-offset:1px;
    border-color:transparent;
  }
  .modal-actions{display:flex;justify-content:flex-end;gap:.6rem;margin-top:.85rem}
  .btn{
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:.7rem;
    font-weight:700;
    letter-spacing:.12em;
    text-transform:uppercase;
    padding:.6rem 1.2rem;
    border-radius:999px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--ink-soft);
    cursor:pointer;
    transition:color .18s ease,background .18s ease,border-color .18s ease;
  }
  .btn:hover{color:var(--ink)}
  .btn.primary{
    background:var(--c-community);
    border-color:var(--c-community);
    color:var(--ground);
  }
  .btn.primary:hover{filter:brightness(1.08);color:var(--ground)}
  .btn:focus-visible{outline:2px solid var(--c-community);outline-offset:2px}
  .btn[disabled]{opacity:.55;cursor:progress}
  .comment-error{margin:.75rem 0 0;font-size:.82rem;line-height:1.45;color:var(--c-community)}
  #commentThanks .modal-title{color:var(--c-community)}

  .links{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.55rem}
  .link-row{
    --accent:var(--c-community);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:1rem;
    padding:.85rem 1.05rem;
    border:1px solid var(--line);
    border-radius:2px;
    background:var(--card);
    color:inherit;
    text-decoration:none;
    transition:background .2s ease,border-color .2s ease,transform .2s ease;
  }
  .link-row:hover,.link-row:focus-visible{
    background:var(--card-hover);
    border-color:color-mix(in srgb,var(--accent) 45%,var(--line));
    transform:translateY(-1px);
  }
  .link-row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .link-name{font-weight:600;font-size:.98rem;margin:0}
  .link-note{margin:.15rem 0 0;font-size:.82rem;color:var(--ink-soft)}
  .link-host{
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:.72rem;
    color:var(--accent);
    white-space:nowrap;
  }

  /* ---------- motion ---------- */
  @keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .anim > *{animation:riseIn .5s cubic-bezier(.2,.7,.3,1) both}
  .anim > *:nth-child(1){animation-delay:.02s}
  .anim > *:nth-child(2){animation-delay:.08s}
  .anim > *:nth-child(3){animation-delay:.14s}
  .anim > *:nth-child(4){animation-delay:.20s}
  .anim > *:nth-child(5){animation-delay:.26s}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none !important;transition:none !important}
  }
</style>
</head>
<body>

<div class="dunes" aria-hidden="true">
  <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" role="presentation" focusable="false">
    <rect x="0" y="0" width="1600" height="900" fill="#E7D6B6"/>
    <path fill="#E2D0AD" d="M0 452 Q300 386 640 440 Q980 494 1290 418 Q1460 376 1600 428 L1600 900 L0 900 Z"/>
    <path fill="#DBC8A3" d="M0 566 Q340 486 700 548 Q1040 608 1330 534 Q1480 496 1600 542 L1600 900 L0 900 Z"/>
    <path fill="#D4C09A" d="M0 682 Q400 600 820 660 Q1200 714 1600 642 L1600 900 L0 900 Z"/>
    <path fill="#CCB78F" d="M0 794 Q460 722 940 774 Q1300 812 1600 752 L1600 900 L0 900 Z"/>
    <g fill="none" stroke="#B9A176" stroke-opacity=".28" stroke-width="1.5">
      <path d="M0 470 Q300 404 640 458 Q980 512 1290 436 Q1460 394 1600 446"/>
      <path d="M0 596 Q340 516 700 578 Q1040 638 1330 564 Q1480 526 1600 572"/>
      <path d="M0 712 Q400 630 820 690 Q1200 744 1600 672"/>
    </g>
  </svg>
</div>

<div class="page">

  <header class="masthead">
    <h1 class="wordmark">CAN<span class="micro ada"><span>ada</span></span>DU<span class="micro bee"><span>B</span></span>AI</h1>
    <p class="byline">By Husam Al-Qawasmeh</p>
  </header>

  <main id="view"></main>

  <div class="bottom-bar">
    <button type="button" class="bar-btn" id="linksOpen">Useful links</button>
    <button type="button" class="bar-btn" id="commentOpen">Leave a comment</button>
  </div>

</div>

<dialog class="modal" id="linksModal" aria-labelledby="linksTitle">
  <div class="pad">
    <h2 class="modal-title" id="linksTitle">Useful links</h2>
    <p class="modal-note">Places worth your time, outside this site.</p>
    <ul class="links" id="linksList"></ul>
    <div class="modal-actions">
      <button type="button" class="btn primary" id="linksClose">Close</button>
    </div>
  </div>
</dialog>

<dialog class="modal" id="commentModal" aria-labelledby="commentTitle">
  <form id="commentForm" novalidate>
    <h2 class="modal-title" id="commentTitle">Leave a comment</h2>
    <p class="modal-note">It goes straight to Husam. Only the message is required.</p>

    <div class="field">
      <label for="cName">Your name</label>
      <input type="text" id="cName" name="name" maxlength="80" autocomplete="name">
    </div>
    <div class="field">
      <label for="cEmail">Email, if you would like a reply</label>
      <input type="email" id="cEmail" name="email" maxlength="120" autocomplete="email">
    </div>
    <div class="field">
      <label for="cMessage">Message</label>
      <textarea id="cMessage" name="message" maxlength="4000" required></textarea>
    </div>

    <p class="comment-error" id="commentError" hidden></p>

    <div class="modal-actions">
      <button type="button" class="btn" id="commentCancel">Cancel</button>
      <button type="submit" class="btn primary" id="commentSend">Send</button>
    </div>
  </form>

  <div class="pad" id="commentThanks" hidden>
    <h2 class="modal-title">Thank you<span id="thanksName"></span></h2>
    <p class="modal-note" id="thanksBody">Your comment is on its way to Husam. It is genuinely appreciated.</p>
    <div class="modal-actions">
      <button type="button" class="btn primary" id="commentDone">Close</button>
    </div>
  </div>
</dialog>

<script>
/* -------------------------------------------------------------------
   EDIT HERE — every screen on this site is generated from SITE below.
     category key -> the URL hash for its screen (#/community)
     compact      -> two entries per row, two lines each
     item.href    -> full destination URL
     item.external-> true opens in a new tab
     item.status  -> "live" (clickable) or "soon" (listed, not clickable)
     item.label   -> optional badge text, replacing Live / In build
   Add a project by copying an item block into a category's items array.
--------------------------------------------------------------------*/
const SITE = {
  community: {
    accent: "var(--c-community)",
    title: "Community Apps",
    blurb: "Free tools for neighbours, schools and families.",
    items: [
      {
        name: "Janna-Zad",
        desc: "Provisions and planning for the journey.",
        href: "https://jannazad.com",
        dest: "jannazad.com",
        external: true,
        status: "live"
      },
      {
        name: "Dubai Schools",
        desc: "Fee sheets and inspections, answered plainly.",
        href: "https://dubai-schools.can-du-ai.com",
        dest: "dubai-schools.can-du-ai.com",
        status: "live"
      }
    ]
  },
  commercial: {
    accent: "var(--c-commercial)",
    title: "Commercial Apps",
    blurb: "Products with a price tag and a paying customer.",
    hideBlurb: true,
    items: [
      {
        name: "Online SuperStore",
        desc: "Catalogue, checkout and fulfilment end to end.",
        href: "https://superstore.can-du-ai.com",
        dest: "superstore.can-du-ai.com",
        status: "soon"
      },
      {

function projectRow(item, compact) {
  const live = item.status === "live";
  const badge = live
    ? '<span class="badge live">' + (item.label || (item.external ? "Live &middot; External" : "Live")) + '</span>'
    : '<span class="badge">' + (item.label || "In build") + '</span>';

  const inner = compact
    ? '<div class="row-head">' +
        '<p class="row-name">' + esc(item.name) + '</p>' + badge +
      '</div>' +
      '<p class="row-desc">' + esc(item.desc) + '</p>'
    : '<div>' +
        '<p class="row-name">' + esc(item.name) + '</p>' +
        '<p class="row-desc">' + esc(item.desc) + '</p>' +
      '</div>' +
      '<div class="row-meta">' + badge + (live ? '<span class="arrow">&#8599;</span>' : '') + '</div>' +
      '<p class="row-dest">' + esc(item.dest) + '</p>';

  const cls = compact ? "row compact" : "row";
  const tip = compact ? ' title="' + esc(item.dest) + '"' : '';

  if (!live) return '<li><div class="' + cls + '"' + tip + '>' + inner + '</div></li>';
  const target = item.external ? ' target="_blank" rel="noopener"' : '';
  return '<li><a class="' + cls + '" href="' + esc(item.href) + '"' + target + tip + '>' + inner + '</a></li>';
}

/* Set the byline's tracking so its line measures exactly as wide as the
   wordmark above it, at any viewport size. */
function fitByline() {
  const mark = document.querySelector(".wordmark");
  const line = document.querySelector(".byline");
  if (!mark || !line) return;

  const chars = line.textContent.length;
  if (chars < 2) return;

  line.style.letterSpacing = "0px";
  line.style.marginRight = "0px";

  const trailing = parseFloat(getComputedStyle(mark).letterSpacing) || 0;
  const target = mark.getBoundingClientRect().width - trailing;
  const base = line.getBoundingClientRect().width;
  if (!target || !base) return;

  const spacing = (target - base) / (chars - 1);
  line.style.letterSpacing = spacing.toFixed(3) + "px";
  line.style.marginRight = (-spacing).toFixed(3) + "px";
}

fitByline();
window.addEventListener("resize", fitByline);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitByline);

/* ---------------- leave a comment ----------------
   Posts to /api/comment, which mails it on. If that endpoint is not
   reachable, fall back to the visitor's own mail client so the note is
   never simply lost. */
(function () {
  const OWNER = "husamalqawasmeh@gmail.com";
  const modal = document.getElementById("commentModal");
  const form = document.getElementById("commentForm");
  const thanks = document.getElementById("commentThanks");
  const thanksName = document.getElementById("thanksName");
  const thanksBody = document.getElementById("thanksBody");
  const errorLine = document.getElementById("commentError");
  const sendBtn = document.getElementById("commentSend");

  if (!modal || !form || typeof modal.showModal !== "function") return;

  function reset() {
    form.hidden = false;
    thanks.hidden = true;
    errorLine.hidden = true;
    sendBtn.disabled = false;
    sendBtn.textContent = "Send";
  }

  document.getElementById("commentOpen").addEventListener("click", () => {
    reset();
    modal.showModal();
    document.getElementById("cMessage").focus();
  });
  document.getElementById("commentCancel").addEventListener("click", () => modal.close());
  document.getElementById("commentDone").addEventListener("click", () => modal.close());

  function mailtoFallback(name, email, message) {
    const subject = "Comment from can-du-ai.com" + (name ? " — " + name : "");
    const body =
      message +
      "\n\n—\n" +
      (name ? "From: " + name + "\n" : "") +
      (email ? "Reply to: " + email + "\n" : "");
    window.location.href =
      "mailto:" + OWNER +
      "?subject=" + encodeURIComponent(subject) +
      "&body=" + encodeURIComponent(body);
  }

  function showThanks(name, viaMailClient) {
    thanksName.textContent = name ? ", " + name : "";
    thanksBody.textContent = viaMailClient
      ? "Your mail app is opening with the comment ready — press send there and it reaches Husam."
      : "Your comment is on its way to Husam. It is genuinely appreciated.";
    form.hidden = true;
    thanks.hidden = false;
    document.getElementById("commentDone").focus();
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = document.getElementById("cName").value.trim();
    const email = document.getElementById("cEmail").value.trim();
    const message = document.getElementById("cMessage").value.trim();

    if (!message) {
      errorLine.textContent = "Please write a message before sending.";
      errorLine.hidden = false;
      document.getElementById("cMessage").focus();
      return;
    }

    errorLine.hidden = true;
    sendBtn.disabled = true;
    sendBtn.textContent = "Sending";

    try {
      const res = await fetch("/api/comment", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, email, message })
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok && data.ok) {
        form.reset();
        showThanks(name, false);
        return;
      }
      throw new Error(data.error || "send failed");
    } catch (err) {
      mailtoFallback(name, email, message);
      form.reset();
      showThanks(name, true);
    }
  });
})();
