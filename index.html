<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Can-Du-AI — an AI portfolio by Husam Al-Qawasmeh: community apps, commercial apps, enterprise solutions, agent AI, LLM reviews and a tool test lab.">
<!--ARTIFACT-START-->
<title>Can-Du-AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=IBM+Plex+Mono:wght@400;500;700&display=swap">
<style>
  /* One light sand world — no dark variant. Every colour is explicit so the
     page holds its own look whatever theme the browser is set to. */
  :root{
    color-scheme:light;
    --ground:#E7D6B6;
    --ink:#241C10;
    --ink-soft:#655741;
    --line:rgba(36,28,16,.18);
    --card:rgba(255,252,246,.88);
    --card-hover:#FFFDF9;
    --shadow:0 1px 2px rgba(60,44,20,.06), 0 14px 30px -18px rgba(60,44,20,.45);

    /* the three navigation buttons */
    --btn:#1F3A63;
    --btn-hover:#2B4E82;
    --btn-ink:#F6ECD8;

    --c-community:#B25A2A;
    --c-commercial:#2F6F76;
    --c-enterprise:#3A4E7A;
    --c-agents:#4E6B35;
    --c-llm:#7A4468;
    --c-multimodal:#2F6B4F;
    --c-lab:#8A6C1F;
    --c-logo:#9C4A1E;
    /* the mark on the logo screen: the same warm brown throughout */
    --mark-ink:#5A3D1C;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Archivo","Helvetica Neue",Arial,sans-serif;
    color:var(--ink);
    background:var(--ground);
    -webkit-font-smoothing:antialiased;
  }

  /* dunes sit behind everything, pinned to the viewport */
  .dunes{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
  }
  .dunes svg{width:100%;height:100%;display:block}

  /* Masthead and bottom bar are pinned; only the middle pane changes. */
  .page{
    position:relative;
    z-index:1;
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
  }

  /* ---------- masthead (fixed) ----------
     It carries the finished mark — the same markup the landing page builds,
     with the story already over. CAN sits above the word and the name below
     it, both out of flow, so the padding here is what reserves their room,
     and it is set in em of the mark so it holds at every size. */
  .masthead{
    flex:0 0 auto;
    display:flex;
    justify-content:center;
    padding:clamp(.7rem,2vh,1.2rem) 1.5rem .2rem;
  }
  .mast-mark{
    display:inline-block;
    font-size:clamp(1.5rem,1.05rem + 1.9vw,2.45rem);
    padding:.52em 0 .95em;
    text-decoration:none;
    color:inherit;
    border-radius:2px;
  }
  .mast-mark:focus-visible{outline:2px solid var(--mark-ink);outline-offset:4px}
  .sr-only{
    position:absolute;
    width:1px;height:1px;
    padding:0;margin:-1px;
    overflow:hidden;
    clip:rect(0 0 0 0);
    white-space:nowrap;
    border:0;
  }

  /* ---------- the pane that changes ---------- */
  main{
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    width:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }
  .pane{
    width:100%;
    max-width:64rem;
    margin:0 auto;
    padding:clamp(1.25rem,3.5vh,2.25rem) 1.5rem;
  }

  /* ---------- category grid ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:.85rem;
  }
  @media (max-width:900px){ .grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
  @media (max-width:600px){ .grid{grid-template-columns:1fr} }

  .tile{
    --accent:var(--ink);
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    min-height:6.5rem;
    gap:.4rem;
    padding:1.25rem 1.35rem;
    border:1px solid var(--line);
    border-radius:2px;
    background:var(--card);
    color:inherit;
    text-decoration:none;
    transition:background .22s ease, transform .22s ease, border-color .22s ease, box-shadow .22s ease;
  }
  .tile::before{
    content:"";
    position:absolute;
    left:-1px; top:-1px; bottom:-1px;
    width:2px;
    background:var(--accent);
    transform:scaleY(0);
    transform-origin:top;
    transition:transform .28s cubic-bezier(.2,.7,.3,1);
  }
  .tile:hover,.tile:focus-visible{
    background:var(--card-hover);
    border-color:color-mix(in srgb,var(--accent) 40%,var(--line));
    box-shadow:var(--shadow);
    transform:translateY(-2px);
  }
  .tile:hover::before,.tile:focus-visible::before{transform:scaleY(1)}
  .tile:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

  .tile-title{
    font-size:clamp(1.05rem,.95rem + .35vw,1.3rem);
    font-weight:600;
    font-stretch:105%;
    letter-spacing:-.01em;
    margin:0;
    line-height:1.25;
    text-wrap:balance;
  }
  .tile-go{
    margin-top:.2rem;
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:.7rem;
    letter-spacing:.1em;
    color:var(--accent);
    opacity:0;
    transform:translateX(-4px);
    transition:opacity .22s ease, transform .22s ease;
  }
  .tile:hover .tile-go,.tile:focus-visible .tile-go{opacity:1;transform:none}

  /* ---------- secondary screen ---------- */
  .crumb{
    display:inline-flex;
    align-items:center;
    gap:.55rem;
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:.84rem;
    font-weight:700;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--btn-ink);
    text-decoration:none;
    padding:.85rem 2rem;
    min-width:13.5rem;
    max-width:100%;
    justify-content:center;
    border:1px solid var(--btn);
    border-radius:999px;
    background:var(--btn);
    box-shadow:var(--shadow);
    transition:background .18s ease,border-color .18s ease,transform .18s ease;
  }
  .crumb:hover,.crumb:focus-visible{
    background:var(--btn-hover);
    border-color:var(--btn-hover);
    transform:translateX(-3px);
  }
  .crumb:focus-visible{outline:3px solid var(--btn);outline-offset:3px}
  .crumb-arrow{
    font-size:1.95em;
    line-height:0;
    font-weight:700;
    position:relative;
    top:.07em;
    transition:transform .18s ease;
  }
  .crumb:hover .crumb-arrow{transform:translateX(-3px)}
  @media (max-width:640px){
    .crumb{min-width:0;width:100%;padding:.85rem 1.5rem}
  }

  .cat-head{margin:1rem 0 0}
  .cat-title{
    font-size:clamp(1.6rem,1.2rem + 1.8vw,2.35rem);
    font-weight:700;
    font-stretch:110%;
    letter-spacing:-.02em;
    line-height:1.05;
    margin:0;
    text-wrap:balance;
  }
  .cat-rule{
    width:3.5rem;height:2px;
    background:var(--accent);
    margin:.7rem 0 .8rem;
  }
  .list{
    list-style:none;
    margin:1.25rem 0 0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:.65rem;
  }
  /* two entries per line, each two lines tall — same rhythm as the main menu */
  .list.two-col{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:.65rem;
  }
  @media (max-width:640px){ .list.two-col{grid-template-columns:1fr} }

  .row{
    display:grid;
    grid-template-columns:minmax(0,1fr) auto;
    align-items:start;
    gap:.2rem 1.5rem;
    padding:1rem 1.3rem;
    border:1px solid var(--line);
    border-radius:2px;
    background:var(--card);
    color:inherit;
    text-decoration:none;
    transition:background .2s ease,border-color .2s ease,transform .2s ease,box-shadow .2s ease;
  }
  a.row:hover,a.row:focus-visible{
    background:var(--card-hover);
    border-color:color-mix(in srgb,var(--accent) 45%,var(--line));
    box-shadow:var(--shadow);
    transform:translateY(-2px);
  }
  a.row:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .row-name{
    font-size:1.05rem;
    font-weight:600;
    letter-spacing:-.01em;
    margin:0 0 .25rem;
  }
  /* project descriptions stay on a single line */
  .row-desc{
    margin:0;
    font-size:.88rem;
    line-height:1.5;
    color:var(--ink-soft);
    max-width:48ch;
    display:-webkit-box;
    -webkit-box-orient:vertical;
    -webkit-line-clamp:1;
    line-clamp:1;
    overflow:hidden;
  }
  .row-dest{
    grid-column:1;
    margin:.5rem 0 0;
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:.72rem;
    color:var(--accent);
    overflow-wrap:anywhere;
  }
  .row-meta{
    grid-column:2;
    grid-row:1 / span 2;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:.5rem;
    white-space:nowrap;
  }
  .badge{
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:.62rem;
    letter-spacing:.13em;
    text-transform:uppercase;
    padding:.28rem .55rem;
    border:1px solid var(--line);
    border-radius:999px;
    color:var(--ink-soft);
  }
  .badge.live{
    color:var(--accent);
    border-color:color-mix(in srgb,var(--accent) 45%,transparent);
  }
  .arrow{
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:1rem;
    line-height:1;
    color:var(--accent);
    transition:transform .2s ease;
  }
  a.row:hover .arrow{transform:translate(3px,-3px)}

  /* compact card: title line, then one description line. Nothing taller. */
  .row.compact{
    display:flex;
    flex-direction:column;
    gap:.28rem;
    padding:.9rem 1.1rem;
  }
  .row.compact .row-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:.75rem;
  }
  .row.compact .row-name{margin:0;font-size:.98rem}
  .row.compact .row-desc{
    max-width:none;
    font-size:.83rem;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .row.compact .badge{flex:0 0 auto}

  .row.empty{border-style:dashed;background:transparent}
  .row.empty .row-name{color:var(--ink-soft);font-weight:500}
  .row.empty code{
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:.85em;
    color:var(--accent);
  }

  /* ---------- bottom bar (fixed) ---------- */
  .bottom-bar{
    flex:0 0 auto;
    display:flex;
    justify-content:center;
    gap:1.1rem;
    flex-wrap:wrap;
    padding:.9rem 1.5rem clamp(1.1rem,3vh,1.75rem);
  }
  .bar-btn{
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:.84rem;
    font-weight:700;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--btn-ink);
    background:var(--btn);
    border:1px solid var(--btn);
    border-radius:999px;
    padding:.85rem 2rem;
    min-width:13.5rem;
    max-width:100%;
    text-align:center;
    cursor:pointer;
    box-shadow:var(--shadow);
    transition:background .18s ease,border-color .18s ease,transform .18s ease;
  }
  @media (max-width:640px){
    .bar-btn{min-width:0;width:100%;padding:.85rem 1.5rem}
  }
  .bar-btn:hover,.bar-btn:focus-visible{
    background:var(--btn-hover);
    border-color:var(--btn-hover);
    transform:translateY(-2px);
  }
  .bar-btn:focus-visible{outline:3px solid var(--btn);outline-offset:3px}

  /* ---------- modals ---------- */
  .modal{
    width:min(32rem,calc(100vw - 2rem));
    max-height:min(80vh,40rem);
    padding:0;
    border:1px solid var(--line);
    border-radius:4px;
    background:var(--ground);
    color:var(--ink);
    box-shadow:var(--shadow);
    overflow:auto;
  }
  .modal::backdrop{background:rgba(28,20,10,.45)}
  .modal form,.modal .pad{padding:1.5rem 1.6rem}
  .modal-title{
    margin:0 0 .3rem;
    font-size:1.2rem;
    font-weight:700;
    font-stretch:105%;
    letter-spacing:-.01em;
  }
  .modal-note{margin:0 0 1rem;font-size:.86rem;line-height:1.5;color:var(--ink-soft)}

  .field{display:flex;flex-direction:column;gap:.3rem;margin-bottom:.75rem}
  .field label{
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:.65rem;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .field input,.field textarea{
    font:inherit;
    font-size:.92rem;
    color:var(--ink);
    background:var(--card-hover);
    border:1px solid var(--line);
    border-radius:2px;
    padding:.55rem .7rem;
    width:100%;
  }
  .field textarea{resize:vertical;min-height:5rem;line-height:1.5}
  .field input:focus,.field textarea:focus{
    outline:2px solid var(--c-community);
    outline-offset:1px;
    border-color:transparent;
  }
  .modal-actions{display:flex;justify-content:flex-end;gap:.6rem;margin-top:.85rem}
  .btn{
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:.7rem;
    font-weight:700;
    letter-spacing:.12em;
    text-transform:uppercase;
    padding:.6rem 1.2rem;
    border-radius:999px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--ink-soft);
    cursor:pointer;
    transition:color .18s ease,background .18s ease,border-color .18s ease;
  }
  .btn:hover{color:var(--ink)}
  .btn.primary{
    background:var(--c-community);
    border-color:var(--c-community);
    color:var(--ground);
  }
  .btn.primary:hover{filter:brightness(1.08);color:var(--ground)}
  .btn:focus-visible{outline:2px solid var(--c-community);outline-offset:2px}
  .btn[disabled]{opacity:.55;cursor:progress}
  .comment-error{margin:.75rem 0 0;font-size:.82rem;line-height:1.45;color:var(--c-community)}
  #commentThanks .modal-title{color:var(--c-community)}

  .links{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.55rem}
  .link-row{
    --accent:var(--c-community);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:1rem;
    padding:.85rem 1.05rem;
    border:1px solid var(--line);
    border-radius:2px;
    background:var(--card);
    color:inherit;
    text-decoration:none;
    transition:background .2s ease,border-color .2s ease,transform .2s ease;
  }
  .link-row:hover,.link-row:focus-visible{
    background:var(--card-hover);
    border-color:color-mix(in srgb,var(--accent) 45%,var(--line));
    transform:translateY(-1px);
  }
  .link-row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .link-name{font-weight:600;font-size:.98rem;margin:0}
  .link-note{margin:.15rem 0 0;font-size:.82rem;color:var(--ink-soft)}
  .link-host{
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:.72rem;
    color:var(--accent);
    white-space:nowrap;
  }

  /* ---------- the logo screen ----------
     The mark assembles itself. A dot opens out into a globe filling the
     stage, shrinks back past its resting size to a dot with a B inside it,
     grows again to settle, and then DU and AI arrive on either side of it.
     CAN comes last, up from below.

     A circle here is a circle from the first frame to the last: nothing is
     ever squashed, flattened or boxed. Every stage is a class added in turn,
     so the browser interpolates between them. */
  .logo-pane{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:1.1rem;
  }
  .logo-stage{
    --gd:min(48vmin,22rem);          /* the globe at its hugest */
    position:relative;
    width:100%;
    min-height:min(56vh,25rem);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  /* Replaying means going back to the start. Without this the finished mark
     would animate itself apart first. */
  .logo-stage.no-anim *{transition:none !important}

  .lg-globe{
    position:absolute;
    left:50%;
    top:50%;
    width:var(--gd);
    height:var(--gd);
    margin:calc(var(--gd) / -2) 0 0 calc(var(--gd) / -2);
    opacity:0;
    /* Laid out at its largest and only ever scaled down, so the artwork is
       never asked to enlarge. Every stage writes the same two functions, so
       they interpolate one for one rather than falling back to matrices.
       It opens at the size it will finish at — the dot — which is the same
       measured scale the end of the sequence returns to. */
    transform:translate(0,0) scale(var(--ts,.06));
  }
  .lg-globe svg,.lg-b-globe svg{display:block;width:100%;height:100%}

  /* 1 — a dot, and nothing else */
  .is-seed .lg-globe{
    opacity:1;
    transform:translate(0,0) scale(var(--ts,.06));
    transition:opacity .35s ease;
  }
  /* 2 — out to full size, filling the stage */
  .is-huge .lg-globe{
    opacity:1;
    transform:translate(0,0) scale(1);
    transition:transform 1s cubic-bezier(.25,.7,.3,1);
  }
  /* 3 — in to the size of a letter, which is where the word reads DUBAI.
     Measured in the script: the slot is a character in a line of type, and
     no stylesheet can know where the line of type has put it. */
  .is-word .lg-globe{
    opacity:1;
    transform:translate(var(--lx,0px),var(--ly,0px)) scale(var(--ls,.2));
    transition:transform 1s cubic-bezier(.5,0,.2,1);
  }
  /* 4 — and on down to a dot, smaller than it will end up */
  .is-small .lg-globe{
    opacity:1;
    transform:translate(var(--tx,0px),var(--ty,0px)) scale(calc(var(--ts,.06) * .72));
    transition:transform 1.05s cubic-bezier(.5,0,.18,1);
  }
  /* 5 — and back up, to settle at the size it keeps */
  .is-grown .lg-globe{
    transform:translate(var(--tx,0px),var(--ty,0px)) scale(var(--ts,.06));
    transition:transform .5s cubic-bezier(.3,1.5,.5,1);
  }
  /* 6 — landed. The copy that lives inside the word takes over, so from here
     the dot reflows with the type like any other character. */
  .is-land .lg-globe{opacity:0;transition:opacity .1s linear}
  .is-land .lg-b-globe{opacity:1;transition:opacity .1s linear}

  /* No size of its own: the masthead sets one and the landing page sets a
     much larger one, and everything inside the mark is in em of it. */
  .lg-mark{
    position:relative;
    font-weight:700;
    font-stretch:125%;
    line-height:1;
    color:var(--mark-ink);
  }
  .logo-stage .lg-mark{font-size:clamp(2.1rem,9.5vmin,5.2rem)}
  .lg-word{
    display:inline-flex;
    align-items:center;
    letter-spacing:.12em;
  }
  /* DU and AI hold their places from the first frame — invisible, but taking
     up room — so the slot can be measured before either of them is shown and
     nothing shifts when they arrive. They arrive at the moment the globe is
     the size of a letter, which is the moment the word reads DUBAI. */
  .lg-side{
    opacity:0;
    transform:translateX(.4em);
  }
  .lg-side.lg-du{transform:translateX(-.4em)}
  .is-word .lg-side{
    opacity:1;
    transform:none;
    transition:opacity .5s ease,transform .6s cubic-bezier(.2,.8,.25,1);
  }
  .is-word .lg-du{transition-delay:0s}
  .is-word .lg-ai{transition-delay:.12s}

  /* The slot the globe comes to rest in, and it has two sizes.

     It starts as a letter: .95em across, which is what it takes for a circle
     to hold a capital B rather than crop it — a B is .72em tall and about
     .62em wide, and the diagonal of that is .95. At that size the word reads
     DUBAI. It ends as the dot the masthead carries, and DU and AI close the
     gap between them as it shrinks.

     Both sizes have to be measured, since the globe is not in the line of
     type and has to be told where the line of type has put its slot. */
  .lg-b{
    position:relative;
    top:-.06em;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:.95em;
    height:.95em;
    margin:0;
    border-radius:50%;
  }
  .lg-b-globe{position:absolute;inset:0;border-radius:50%;overflow:hidden;opacity:0}
  /* Reads over the pale ocean and the dark land alike: a soft halo rather
     than a plate behind it, which would put a box inside the circle. */
  .lg-b > .lg-letter{
    position:relative;
    z-index:1;
    font-size:1em;
    font-stretch:100%;
    letter-spacing:0;
    line-height:1;
    color:var(--mark-ink);
    /* A halo rather than a plate behind it, which would put a box inside the
       circle. Tight at this size: the letter is nearly as wide as the globe,
       so it needs an edge to sit on, not a glow — in em, a generous one here
       would be thirty pixels of white and would bleach the globe out. */
    text-shadow:0 0 .045em rgba(255,255,255,.92),0 0 .09em rgba(255,255,255,.6);
    opacity:0;
  }
  /* It is there for the word DUBAI, and stays for everything after it */
  .is-word .lg-b > .lg-letter{
    opacity:1;
    transition:opacity .5s ease .25s;
  }
  /* Down to the dot, the slot, the letter and the globe on one undershoot,
     then all three settle together. The letter is sized off the slot rather
     than transformed, so it stays a letter in a line of type. */
  .is-small .lg-b{
    width:calc(.4em * .72);
    height:calc(.4em * .72);
    top:.02em;
    margin:0 .05em;
    transition:width 1.05s cubic-bezier(.5,0,.18,1),
               height 1.05s cubic-bezier(.5,0,.18,1),
               top 1.05s cubic-bezier(.5,0,.18,1),
               margin 1.05s cubic-bezier(.5,0,.18,1);
  }
  /* Once it is a fifth of the size, over a globe a fifth of the size, it
     needs the glow back — proportionally far more of it. */
  .is-small .lg-b > .lg-letter{
    font-size:calc(.17em * .72);
    text-shadow:0 0 .18em #fff,0 0 .4em rgba(255,255,255,.85);
    transition:font-size 1.05s cubic-bezier(.5,0,.18,1),
               text-shadow 1.05s ease;
  }
  .is-grown .lg-b{
    width:.4em;
    height:.4em;
    transition:width .5s cubic-bezier(.3,1.5,.5,1),
               height .5s cubic-bezier(.3,1.5,.5,1);
  }
  .is-grown .lg-b > .lg-letter{
    font-size:.17em;
    transition:font-size .5s cubic-bezier(.3,1.5,.5,1);
  }

  /* CAN arrives below the word, ranged right with it, then travels up and
     across to sit above it ranged left. Its resting place is the one in the
     stylesheet; the arrival is a transform off it, measured in the script. */
  .lg-can{
    position:absolute;
    left:0;
    bottom:100%;
    margin-bottom:.1em;
    font-size:.33em;
    font-stretch:110%;
    letter-spacing:.18em;
    opacity:0;
    transform:translate(var(--cx,0px),var(--cy,0px));
  }
  .is-can .lg-can{
    opacity:1;
    transition:opacity .45s ease;
  }
  .is-done .lg-can{
    opacity:1;
    transform:translate(0,0);
    transition:transform .85s cubic-bezier(.35,.9,.3,1),opacity .3s ease;
  }
  /* ---- the byline, written once the mark is finished ----
     The fifteen letters are written out in alphabetical order, then two of
     them trade places every beat. A letter that lands in its own column
     turns green and stops moving, so the name assembles itself out of the
     letters it was given. Centred on the mark: the strip is a fixed sixteen
     columns wide, so centring the strip centres the name. */
  .lg-by{
    position:absolute;
    top:100%;
    left:50%;
    margin-top:.5em;
    /* Centred on the word's ink, not on its box. The word carries tracking
       after its last letter, which the box includes and the eye does not, so
       centring on the box leaves the name sitting half that much to the
       right; the nudge is measured and takes it back. */
    transform:translateX(calc(-50% + var(--nudge,0px)));
    display:flex;
    justify-content:center;
    font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:.32em;
    font-weight:700;
    line-height:1;
    white-space:nowrap;
    /* the brown the mark is set in, warmed a little: at this size the near
       black of the big letters reads as black rather than as brown */
    color:#5A3D1C;
    opacity:0;
  }
  .is-by .lg-by{opacity:1;transition:opacity .5s ease}
  /* Monospaced, so a column is a column whatever letter is standing in it.
     The letters are laid out on top of one another and moved by transform:
     they have to be able to pass through each other, which they cannot do
     while they are taking up room in a line. */
  .by-slots{
    --sw:.78em;
    position:relative;
    display:block;
    width:calc(16 * var(--sw));
    height:1em;
  }
  .by-l{
    position:absolute;
    left:0;
    top:0;
    width:var(--sw);
    text-align:center;
    opacity:0;
    transform:translateX(calc(var(--i,0) * var(--sw)));
    /* short, because there are a good many swaps to get through before the
       name is finished and each one has to land before the next is called */
    transition:transform .3s cubic-bezier(.4,0,.2,1),color .3s ease;
  }
  /* Written on one letter at a time, left to right across the columns. Only
     the fade is staggered — a delay on the transform would hold a letter
     back mid-swap for the rest of the sequence. */
  .is-letters .by-l{
    opacity:1;
    transition:transform .3s cubic-bezier(.4,0,.2,1),
               color .3s ease,
               opacity .3s ease calc(var(--d,0) * 80ms);
  }
  /* Home, and staying there. Green, and dark enough to hold 5.3:1 on the
     sand. */
  .by-l.is-home{color:#17612f}

  /* The finished mark with no story attached: what the masthead carries,
     and where the landing page leaves off. */
  .is-set .lg-side{opacity:1;transform:none}
  .is-set .lg-b{width:.4em;height:.4em;top:.02em;margin:0 .05em}
  .is-set .lg-b > .lg-letter{
    opacity:1;
    font-size:.17em;
    text-shadow:0 0 .18em #fff,0 0 .4em rgba(255,255,255,.85);
  }
  .is-set .lg-b-globe{opacity:1}
  .is-set .lg-can{opacity:1;transform:translate(0,0)}
  .is-set .lg-by{opacity:1}
  .is-set .by-l{opacity:1}

  /* Landing: until the mark has drawn itself the masthead is empty and the
     bar at the foot is out of the way. */
  .is-intro .masthead .lg-mark{opacity:0}
  .is-intro .bottom-bar{opacity:0;pointer-events:none}
  .is-intro .lg-replay{display:none}
  .is-intro.is-landed .masthead .lg-mark{opacity:1;transition:opacity .25s ease}
  .is-intro.is-landed .bottom-bar{opacity:1;transition:opacity .5s ease .12s}
  /* on the way up it stops being a puzzle and goes back to being a name */
  .is-flying .by-l.is-home{color:inherit;transition:color .7s ease}

  .lg-replay{align-self:center}

  /* ---------- motion ---------- */
  @keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .anim > *{animation:riseIn .5s cubic-bezier(.2,.7,.3,1) both}
  .anim > *:nth-child(1){animation-delay:.02s}
  .anim > *:nth-child(2){animation-delay:.08s}
  .anim > *:nth-child(3){animation-delay:.14s}
  .anim > *:nth-child(4){animation-delay:.20s}
  .anim > *:nth-child(5){animation-delay:.26s}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none !important;transition:none !important}
    /* One exception, and only for the hand-over from the middle of the page
       to the masthead: the preference is about movement, and this is a
       cross-fade between two things that never move. */
    .is-intro .masthead .lg-mark,
    .is-intro .logo-stage .lg-mark{transition:opacity .4s ease !important}
  }
</style>

  { name: "AAMAD", note: "Carmelo's context engineering framework for multi-agent builds.", url: "https://github.com/synaptic-ai-consulting/AAMAD" }
];

const view = document.getElementById("view");

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function renderHome() {
  document.title = "Can-Du-AI";
  view.innerHTML = '<div class="pane"><div class="grid anim">' + ORDER.map(key => {
    const cat = SITE[key];
    return '<a class="tile" style="--accent:' + cat.accent + '" href="#/' + key + '">' +
      '<h2 class="tile-title">' + esc(cat.title) + '</h2>' +
      '<span class="tile-go">Open &rarr;</span>' +
      '</a>';
  }).join("") + '</div></div>';
}

function projectRow(item, compact) {
  const live = item.status === "live";
  const badge = live
    ? '<span class="badge live">' + (item.label || (item.external ? "Live &middot; External" : "Live")) + '</span>'
    : '<span class="badge">' + (item.label || "In build") + '</span>';

  const inner = compact
    ? '<div class="row-head">' +
        '<p class="row-name">' + esc(item.name) + '</p>' + badge +
      '</div>' +
      '<p class="row-desc">' + esc(item.desc) + '</p>'
    : '<div>' +
        '<p class="row-name">' + esc(item.name) + '</p>' +
        '<p class="row-desc">' + esc(item.desc) + '</p>' +
      '</div>' +
      '<div class="row-meta">' + badge + (live ? '<span class="arrow">&#8599;</span>' : '') + '</div>' +
      '<p class="row-dest">' + esc(item.dest) + '</p>';

  const cls = compact ? "row compact" : "row";
  const tip = compact ? ' title="' + esc(item.dest) + '"' : '';

  if (!live) return '<li><div class="' + cls + '"' + tip + '>' + inner + '</div></li>';
  const target = item.external ? ' target="_blank" rel="noopener"' : '';
  return '<li><a class="' + cls + '" href="' + esc(item.href) + '"' + target + tip + '>' + inner + '</a></li>';
}

function emptyRow(key) {
  return '<li><div class="row empty">' +
    '<div>' +
      '<p class="row-name">Nothing published here yet</p>' +
      '<p class="row-desc">Add entries to the <code>' + esc(key) + '</code> list in index.html.</p>' +
    '</div>' +
    '<div class="row-meta"><span class="badge">Empty</span></div>' +
    '</div></li>';
}

/* ---------------- the logo, assembling itself ----------------
   Six stages, each a class on the stage. The CSS holds every value except
   the two that can only be measured: where the dot sits inside the line of
   type, and how far CAN has to travel to get above it. */
let logoTimers = [];
let byTimer = 0;
const clearLogo = () => {
  logoTimers.forEach(clearTimeout);
  logoTimers = [];
  // The shuffle reschedules itself for as long as the screen is open, so it
  // is held on its own rather than piling up in the list above.
  clearTimeout(byTimer);
  byTimer = 0;
};

/* Where the globe has to stop, both times, and where CAN comes in from.

   Called again in the gap between the globe finishing its growth and the
   word arriving: by then the webfont has landed, and every one of these
   numbers comes from the metrics of a typeface. Doing it in a gap matters —
   the reading needs transitions off for a moment, and that would cut short
   any that were running. */
function measureLogo(stage) {
  const slot = stage.querySelector(".lg-b");
  const globe = stage.querySelector(".lg-globe");
  const mark = stage.querySelector(".lg-mark");
  const can = stage.querySelector(".lg-can");
  if (!slot || !globe || !mark || !can) return;

  const box = stage.getBoundingClientRect();
  const size = globe.offsetWidth || 1;
  const put = (rect, px, py, ps) => {
    globe.style.setProperty(px,
      (rect.left + rect.width / 2 - (box.left + box.width / 2)).toFixed(2) + "px");
    globe.style.setProperty(py,
      (rect.top + rect.height / 2 - (box.top + box.height / 2)).toFixed(2) + "px");
    globe.style.setProperty(ps, (rect.width / size).toFixed(4));
  };

  // the slot at letter size, which is the stylesheet's default
  put(slot.getBoundingClientRect(), "--lx", "--ly", "--ls");

  /* And the slot once it has shrunk to a dot. That layout has to be put in
     place to be read, so it is applied with transitions off and taken back
     within the same task — nothing is painted in between. It is also the
     layout CAN is measured against, since the word is narrower by then. */
  const held = stage.classList.contains("no-anim");
  stage.classList.add("no-anim", "is-small", "is-grown");
  void stage.offsetWidth;
  put(slot.getBoundingClientRect(), "--tx", "--ty", "--ts");
  fitName(mark);                             // against the word at its final width

  /* Where CAN comes in: below the word, its right edge against the word's.
     Taken from the layout box rather than getBoundingClientRect, because the
     rect already carries the translation these very properties apply — read
     that way, a second run measures its own answer and lands on zero. */
  const em = parseFloat(getComputedStyle(mark).fontSize) || 0;
  const below = parseFloat(getComputedStyle(can).marginBottom) || 0;
  can.style.setProperty("--cx", (mark.offsetWidth - can.offsetWidth).toFixed(2) + "px");
  can.style.setProperty("--cy",
    (mark.offsetHeight + can.offsetHeight + below + em * 0.16).toFixed(2) + "px");

  stage.classList.remove("is-small", "is-grown");
  void stage.offsetWidth;
  if (!held) stage.classList.remove("no-anim");
}

/* The name, refusing to settle.

   Letters are judged by their character and not by which span they are: to
   anyone reading, the three As are the same A, and one of them standing in
   an A's column is that column answered. Nothing is ever locked in place —
   a solved letter is swapped away again like any other, which is what keeps
   the name a puzzle rather than a slow reveal. */
const BY_NAME = "HUSAM ALQAWASMEH";

function byCells() {
  let out = "", col = 0;
  for (const ch of BY_NAME) {
    if (ch !== " ") {
      out += '<span class="by-l" data-c="' + ch + '" style="--i:' + col + '">' + ch + '</span>';
    }
    col++;                                   // the space is a column no letter uses
  }
  return out;
}

/* The mark, written in one place. The masthead carries it finished; the
   landing page builds it. The only difference is the travelling globe, which
   belongs to the animation and so is not part of this. */
function markHTML(id, extra) {
  return '<span class="lg-mark' + (extra ? " " + extra : "") + '"' +
      (id ? ' id="' + id + '"' : "") + ' aria-hidden="true">' +
      '<span class="lg-can">CAN</span>' +
      '<span class="lg-word">' +
        '<span class="lg-side lg-du">DU</span>' +
        '<span class="lg-b">' +
          '<span class="lg-letter">B</span>' +
          '<span class="lg-b-globe"><svg viewBox="0 0 200 200">' +
            '<use href="#cdaGlobe"/></svg></span>' +
        '</span>' +
        '<span class="lg-side lg-ai">AI</span>' +
      '</span>' +
      '<span class="lg-by">' +
        '<span class="by-slots">' + byCells() + '</span>' +
      '</span>' +
    '</span>';
}

/* The name is set to the width of the word above it.

   Sixteen columns of equal width with the letters centred in them: the ink
   starts half a column in and stops half a column short, so for the ink
   itself to measure the same as the word, the columns have to come to a
   glyph less than the word rather than to the word. */
function fitName(mark) {
  if (!mark) return;
  const word = mark.querySelector(".lg-word");
  const by = mark.querySelector(".lg-by");
  const slots = mark.querySelector(".by-slots");
  if (!word || !by || !slots) return;

  const probe = document.createElement("span");
  probe.textContent = "M";
  probe.style.cssText = "position:absolute;visibility:hidden;white-space:pre";
  by.appendChild(probe);
  const glyph = probe.getBoundingClientRect().width;
  probe.remove();

  // the word carries tracking after its last letter, which is not ink
  const trailing = parseFloat(getComputedStyle(word).letterSpacing) || 0;
  const w = word.getBoundingClientRect().width - trailing;
  if (!w || !glyph) return;
  slots.style.setProperty("--sw", ((w - glyph) / 15).toFixed(3) + "px");
  by.style.setProperty("--nudge", (-trailing / 2).toFixed(2) + "px");
}

function startByline(stage, shuffle, onSolved) {
  const slots = stage.querySelector(".by-slots");
  if (!slots) return;
  const letters = Array.prototype.slice.call(slots.querySelectorAll(".by-l"));
  if (!letters.length) return;

  const want = {};                           // want[column] = the letter it wants
  let col = 0;
  for (const ch of BY_NAME) { if (ch !== " ") want[col] = ch; col++; }

  const at = letters.map((el) => Number(el.style.getPropertyValue("--i")));

  /* A letter that reaches its own column is done with: it turns green and is
     taken out of the draw, so it cannot be swapped away again. Which means
     the name does assemble itself, one letter at a time, out of the letters
     it was given.

     Judged by character rather than by which span it is — to a reader the
     four As are the same A, so any of them standing in an A's column answers
     it. The last letter needs no luck: once fourteen columns are right the
     fifteenth has nowhere else to be. */
  const locked = letters.map(() => false);

  const place = () => letters.forEach((el, k) => {
    el.style.setProperty("--i", String(at[k]));
    if (want[at[k]] === el.dataset.c) locked[k] = true;
    el.classList.toggle("is-home", locked[k]);
  });

  if (!shuffle) { place(); return; }         // motion turned down: leave it read

  /* It does not open on a scatter. The letters are written out in
     alphabetical order — AAAAE HHLMMQSSUW — which shows the reader what
     there is to work with before any of it starts moving. */
  const cols = [];
  let n = 0;
  for (const ch of BY_NAME) { if (ch !== " ") cols.push(n); n++; }
  letters
    .map((el, k) => k)
    .sort((a, b) => (letters[a].dataset.c < letters[b].dataset.c ? -1 : 1))
    .forEach((k, rank) => { at[k] = cols[rank]; });
  place();

  /* Written out left to right: each letter is told how many places along the
     line it is, and the stylesheet turns that into its own delay. */
  // (in alphabetical order this is simply left to right)
  letters
    .map((el, k) => ({ el, col: at[k] }))
    .sort((a, b) => a.col - b.col)
    .forEach((item, rank) => item.el.style.setProperty("--d", String(rank)));

  const swap = () => {
    const free = [];
    for (let k = 0; k < letters.length; k++) if (!locked[k]) free.push(k);
    if (free.length < 2) {                   // the name is finished
      if (onSolved) onSolved();
      return;
    }
    const pick = () => free[Math.floor(Math.random() * free.length)];
    const a = pick();
    let b = pick();
    while (b === a) b = pick();              // free.length is at least two
    const t = at[a]; at[a] = at[b]; at[b] = t;
    place();
    byTimer = setTimeout(swap, 330 + Math.random() * 260);
  };
  // Nothing moves until the last letter has been written
  byTimer = setTimeout(swap, 2100);
}

/* The mark leaves the middle of the page for the masthead, and stays there.

   Both ends are measured and it goes in one transform. The two are the same
   markup at two sizes, so putting one box on the other puts everything
   inside it on everything inside the other. */
function flyToMasthead(stage) {
  const from = stage.querySelector(".lg-mark");
  const to = document.getElementById("mastMark");
  if (!from || !to) return finishIntro(stage);

  const a = from.getBoundingClientRect();
  const b = to.getBoundingClientRect();
  if (!a.width || !b.width) return finishIntro(stage);

  stage.classList.add("is-flying");
  from.style.transformOrigin = "top left";
  from.style.transition = "transform 1.05s cubic-bezier(.5,0,.2,1),opacity .24s ease";
  from.style.transform =
    "translate(" + (b.left - a.left).toFixed(2) + "px," +
                   (b.top - a.top).toFixed(2) + "px) " +
    "scale(" + (b.width / a.width).toFixed(4) + ")";
  logoTimers.push(setTimeout(() => finishIntro(stage), 1080));
}

/* Hand over: the masthead's copy comes up as the flown one goes down, both
   at the same size in the same place, and the site proper takes the screen. */
function finishIntro(stage) {
  introDone = true;
  document.body.classList.add("is-landed");
  const from = stage && stage.querySelector(".lg-mark");
  if (from) from.style.opacity = "0";
  logoTimers.push(setTimeout(() => {
    document.body.classList.remove("is-intro", "is-landed");
    renderHome();
    setBack(false);
  }, 420));                                   // long enough for the fade to finish
}

function playLogo(intro) {
  clearLogo();
  const stage = document.getElementById("logoStage");
  if (!stage) return;

  /* With motion turned down there is no story to tell, only the mark — but
     it still forms in the middle of the page before it goes up. It arrives
     there whole rather than assembling itself, holds long enough to be read,
     and hands over by fading. What the preference rules out is the
     travelling and the scaling, not the order of events. */
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    stage.className = "logo-stage is-set";
    fitName(stage.querySelector(".lg-mark"));
    if (intro) logoTimers.push(setTimeout(() => finishIntro(stage), 1600));
    return;
  }

  stage.className = "logo-stage no-anim";
  void stage.offsetWidth;                       // commit the reset before animating
  measureLogo(stage);
  stage.classList.remove("no-anim");
  {
    const at = (ms, cls) => logoTimers.push(setTimeout(() => stage.classList.add(cls), ms));
    at(60,   "is-seed");    // a dot, the size the mark ends on
    at(400,  "is-huge");    // out to full size, filling the stage
    // in the gap: the real font is in by now, and every number below comes
    // from its metrics
    logoTimers.push(setTimeout(() => measureLogo(stage), 1380));
    at(1450, "is-word");    // in to letter size — the word reads DUBAI
    at(2600, "is-small");   // on down to a dot, the B shrinking with it
    at(3700, "is-grown");   // and settled at the size it keeps
    at(4250, "is-land");    // hand over to the copy in the word
    at(4600, "is-can");     // CAN, below the word and ranged right
    at(5250, "is-done");    // up and across, to sit above it ranged left
    /* The name is set against the word as it actually stands, a moment
       before it is shown. Everything that changes the word's width — the
       slot shrinking out of DUBAI, the webfont arriving — is long finished
       by now, and measuring the live layout beats predicting it: the earlier
       reading is taken from a layout applied for a fraction of a second to
       be read, and any difference between that and the real one ends up in
       the name's width. */
    logoTimers.push(setTimeout(() => fitName(stage.querySelector(".lg-mark")), 6100));
    // the letters, alphabetical, written out one at a time
    at(6150, "is-by");
    logoTimers.push(setTimeout(
      () => startByline(stage, true, intro ? () => flyToMasthead(stage) : null), 6210));
    at(6500, "is-letters");
  }
}

function renderLogo(intro) {
  document.title = intro ? "Can-Du-AI" : "The Logo — Can-Du-AI";
  view.innerHTML =
    // no .anim here: this screen is its own entrance, and the pane-level
    // rise would fade the stage in over the top of it
    '<div class="pane logo-pane">' +
      '<div class="logo-stage" id="logoStage" role="img" aria-label="' +
        'The Can-Du-AI mark assembling itself: a dot opens out into a globe ' +
        'turned to the Gulf, shrinks back to a dot with a B inside it, DU ' +
        'and AI arrive on either side, and CAN rises from below the word to ' +
        'sit above it. Underneath, the letters of Husam Al-Qawasmeh are ' +
        'written out in alphabetical order and then shuffle themselves into ' +
        'the name.">' +
        '<span class="lg-globe" aria-hidden="true">' +
          '<svg viewBox="0 0 200 200"><use href="#cdaGlobe"/></svg></span>' +
        markHTML("", "") +
      '</div>' +
      '<button type="button" class="btn lg-replay" id="logoReplay">Play again</button>' +
    '</div>';
  document.getElementById("logoReplay").addEventListener("click", () => playLogo(false));
  playLogo(intro);

  /* The measurements depend on text metrics, so they are taken again once the
     webfont is in. Play is not held back for it: a promise that never settles
     — a slow or blocked font — would otherwise leave the screen empty for
     good, and a retarget mid-flight is only a transition changing its mind. */
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => {
      const stage = document.getElementById("logoStage");
      if (stage) measureLogo(stage);
    });
  }
}

function renderCategory(key) {
  const cat = SITE[key];
  if (cat.special === "logo") return renderLogo();
  document.title = cat.title + " — Can-Du-AI";
  const compact = !!cat.compact;
  const rows = cat.items.length
    ? cat.items.map(item => projectRow(item, compact)).join("")
    : emptyRow(key);
  view.innerHTML =
    '<div class="pane"><div class="anim" style="--accent:' + cat.accent + '">' +
      '<div class="cat-head">' +
        '<h2 class="cat-title">' + esc(cat.title) + '</h2>' +
        '<div class="cat-rule"></div>' +
      '</div>' +
      '<ul class="list' + (compact ? ' two-col' : '') + '">' + rows + '</ul>' +
    '</div></div>';
}

// the back button joins the bottom row, ahead of the other two
function setBack(on) {
  const slot = document.getElementById("backSlot");
  if (slot) {
    slot.innerHTML = on
      ? '<a class="crumb" href="#/"><span class="crumb-arrow">&larr;</span> All categories</a>'
      : "";
  }
}

/* The front door is the mark drawing itself, once a visit. Arriving straight
   at a category skips it — an intro belongs to the front door — and so does
   coming back to the grid later. */
let introDone = false;

function route() {
  clearLogo();                                  // leaving the logo screen stops it
  const key = location.hash.replace(/^#\/?/, "").trim();
  const onCategory = Object.prototype.hasOwnProperty.call(SITE, key);

  if (!introDone && key === "") {
    document.body.classList.add("is-intro");
    setBack(false);
    renderLogo(true);
    return;
  }

  introDone = true;
  document.body.classList.remove("is-intro", "is-landed");
  if (onCategory) renderCategory(key); else renderHome();
  setBack(onCategory);
  view.scrollTop = 0;
}

/* The masthead's copy of the mark, built from the same function and set to
   its finished state. It has to exist before the landing page can fly its
   own copy into it. */
const mastLink = document.getElementById("mastLink");
if (mastLink) mastLink.innerHTML = markHTML("mastMark", "is-set");

const fitAll = () => {
  fitName(document.getElementById("mastMark"));
  /* The landing page's word is only its final width once the slot has shrunk
     to a dot; before that measureLogo does the fitting, from inside the
     layout it applies to read it. */
  const stage = document.getElementById("logoStage");
  if (stage && (stage.classList.contains("is-grown") ||
                stage.classList.contains("is-set"))) {
    fitName(stage.querySelector(".lg-mark"));
  }
};
fitAll();
window.addEventListener("resize", fitAll);
// the width of a name is the width of a typeface, so it is taken again once
// the real one is in
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);

window.addEventListener("hashchange", route);
route();

/* ---------------- useful links ---------------- */
(function () {
  const modal = document.getElementById("linksModal");
  const list = document.getElementById("linksList");
  if (!modal || typeof modal.showModal !== "function") return;

  list.innerHTML = LINKS.map(l => {
    const host = l.url.replace(/^https?:\/\//, "").replace(/\/$/, "");
    return '<li><a class="link-row" href="' + esc(l.url) + '" target="_blank" rel="noopener">' +
      '<span><p class="link-name">' + esc(l.name) + '</p>' +
      '<p class="link-note">' + esc(l.note) + '</p></span>' +
      '<span class="link-host">' + esc(host) + ' &#8599;</span>' +
      '</a></li>';
  }).join("");

  document.getElementById("linksOpen").addEventListener("click", () => modal.showModal());
  document.getElementById("linksClose").addEventListener("click", () => modal.close());
})();

/* ---------------- leave a comment ----------------
   Posts to /api/comment, which mails it on. If that endpoint is not
   reachable, fall back to the visitor's own mail client so the note is
   never simply lost. */
(function () {
  const OWNER = "husamalqawasmeh@gmail.com";
  const modal = document.getElementById("commentModal");
  const form = document.getElementById("commentForm");
  const thanks = document.getElementById("commentThanks");
  const thanksName = document.getElementById("thanksName");
  const thanksBody = document.getElementById("thanksBody");
  const errorLine = document.getElementById("commentError");
  const sendBtn = document.getElementById("commentSend");

  if (!modal || !form || typeof modal.showModal !== "function") return;

  function reset() {
    form.hidden = false;
    thanks.hidden = true;
    errorLine.hidden = true;
    sendBtn.disabled = false;
    sendBtn.textContent = "Send";
  }

  document.getElementById("commentOpen").addEventListener("click", () => {
    reset();
    modal.showModal();
    document.getElementById("cMessage").focus();
  });
  document.getElementById("commentCancel").addEventListener("click", () => modal.close());
  document.getElementById("commentDone").addEventListener("click", () => modal.close());

  function mailtoFallback(name, email, message) {
    const subject = "Comment from can-du-ai.com" + (name ? " — " + name : "");
    const body =
      message +
      "\n\n—\n" +
      (name ? "From: " + name + "\n" : "") +
      (email ? "Reply to: " + email + "\n" : "");
    window.location.href =
      "mailto:" + OWNER +
      "?subject=" + encodeURIComponent(subject) +
      "&body=" + encodeURIComponent(body);
  }

  function showThanks(name, viaMailClient) {
    thanksName.textContent = name ? ", " + name : "";
    thanksBody.textContent = viaMailClient
      ? "Your mail app is opening with the comment ready — press send there and it reaches Husam."
      : "Your comment is on its way to Husam. It is genuinely appreciated.";
    form.hidden = true;
    thanks.hidden = false;
    document.getElementById("commentDone").focus();
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = document.getElementById("cName").value.trim();
    const email = document.getElementById("cEmail").value.trim();
    const message = document.getElementById("cMessage").value.trim();

    if (!message) {
      errorLine.textContent = "Please write a message before sending.";
      errorLine.hidden = false;
      document.getElementById("cMessage").focus();
      return;
    }

    errorLine.hidden = true;
    sendBtn.disabled = true;
    sendBtn.textContent = "Sending";

    try {
      const res = await fetch("/api/comment", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, email, message })
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok && data.ok) {
        form.reset();
        showThanks(name, false);
        return;
      }
      throw new Error(data.error || "send failed");
    } catch (err) {
      mailtoFallback(name, email, message);
      form.reset();
      showThanks(name, true);
    }
  });
})();
